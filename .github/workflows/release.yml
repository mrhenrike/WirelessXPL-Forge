# Author: André Henrique (@mrhenrike) | União Geek — https://github.com/Uniao-Geek

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write
  id-token: write

jobs:
  # ── 1. Build source + wheel distributions ────────────────────────────────
  build:
    name: "Build distributions"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Verify distributions
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 2. Publish to PyPI ───────────────────────────────────────────────────
  #
  #   Primary path  : Trusted Publisher (OIDC) — no secret needed.
  #     Configure at https://pypi.org/manage/project/wirelessxpl/settings/publishing/
  #     Publisher: mrhenrike/WirelessXPL-Forge  workflow: release.yml  env: pypi
  #
  #   Fallback path : API token via repository secret PYPI_TOKEN.
  #     Add at https://github.com/mrhenrike/WirelessXPL-Forge/settings/secrets/actions
  #
  publish-pypi:
    name: "Publish → PyPI"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wirelessxpl/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        if: ${{ vars.PYPI_PUBLISH_MODE != 'token' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        continue-on-error: true
        id: oidc_publish

      - name: Publish to PyPI (API token fallback)
        if: ${{ steps.oidc_publish.outcome == 'failure' || vars.PYPI_PUBLISH_MODE == 'token' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  # ── 3. Create GitHub Release with notes and assets ───────────────────────
  github-release:
    name: "GitHub Release"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          echo "## What's Changed" > notes.md
          git log --oneline --no-merges $RANGE | while read line; do
            echo "- $line" >> notes.md
          done
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "**Package**: [wirelessxpl ${{ steps.ver.outputs.version }} on PyPI](https://pypi.org/project/wirelessxpl/${{ steps.ver.outputs.version }}/)" >> notes.md
          echo "**Author**: André Henrique (@mrhenrike) | União Geek" >> notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
