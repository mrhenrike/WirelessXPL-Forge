# Author: André Henrique (@mrhenrike) | União Geek — https://github.com/Uniao-Geek

name: CI

on:
  push:
    branches: [main, "xpl-maint/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: "ruff / ubuntu / py3.12"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check wirelessxpl/

  typecheck:
    name: "mypy / ubuntu / py3.12"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install xpl-core from GitHub
        run: pip install "xpl-core @ git+https://github.com/mrhenrike/xpl-core.git@main"
      - run: pip install -e ".[dev]"
      - name: mypy baseline (core only, non-blocking; 152 errors at 2026-10-20)
        run: |
          mypy wirelessxpl/core/ --config-file pyproject.toml 2>&1 | tee mypy-report.txt || true
          echo "::notice::mypy exited with errors (non-blocking baseline)"
      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy-report.txt

  test:
    name: "test / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install xpl-core from GitHub
        run: pip install "xpl-core @ git+https://github.com/mrhenrike/xpl-core.git@main"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: .pytest_cache/
