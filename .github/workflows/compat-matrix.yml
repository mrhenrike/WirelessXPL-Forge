# Author: André Henrique (@mrhenrike) | União Geek — https://github.com/Uniao-Geek

name: compatibility-matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run compatibility smoke check
        run: |
          python tools/compat_smoke.py

      - name: Validate Python syntax compilation
        run: |
          python -m compileall -q wirelessxpl tools wxf.py

  quality-security:
    name: "quality-security / ubuntu / py3.11"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Install audit tooling
        run: |
          python -m pip install pip-audit flake8 bandit

      - name: Validate dependency graph
        run: |
          python -m pip check

      - name: Validate governance baseline
        run: |
          python tools/validate_governance.py

      - name: Lint gate (critical errors)
        run: |
          flake8 wirelessxpl/core wirelessxpl/modules wxf.py tools --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Regenerate catalogs (consistency)
        run: |
          python tools/generate_full_catalog.py
          python tools/generate_coverage_matrix.py
          python tools/gen_wiki_module_index.py
          git diff --exit-code docs/FULL_CATALOG.md docs/FULL_CATALOG.txt docs/COVERAGE_MATRIX.md docs/COVERAGE_MATRIX.txt docs/wiki/ANEXO-INDICE-MODULOS.md

      - name: Dependency vulnerability audit
        run: |
          pip-audit -r requirements.txt --progress-spinner off

      - name: Static security review (bandit, tools only)
        run: |
          bandit -q -r tools -lll

  dependency-review:
    name: "dependency-review / pull_request"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
