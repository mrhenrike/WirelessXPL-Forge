name: compatibility-matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run compatibility smoke check
        run: |
          python tools/compat_smoke.py

      - name: Compile package
        run: |
          python -m compileall -q wirelessxpl

  quality-lite:
    name: "quality-lite / ubuntu / py3.11"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Lint gate (critical errors)
        run: |
          flake8 wirelessxpl/core wirelessxpl/modules wxf.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Regenerate catalog (consistency)
        run: |
          python tools/generate_full_catalog.py
          git diff --exit-code docs/FULL_CATALOG.md docs/FULL_CATALOG.txt
