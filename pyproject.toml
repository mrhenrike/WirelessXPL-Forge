# Author: André Henrique (@mrhenrike) | União Geek — https://github.com/Uniao-Geek
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wirelessxpl"
version = "2.2.0"
description = "WirelessXPL-Forge: modular wireless security research framework for Wi-Fi, BLE, Zigbee, RFID and ESP32 lab workflows"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "XSRL-1.0" }
authors = [
    { name = "André Henrique (@mrhenrike) | União Geek", email = "suporte@uniaogeek.com.br" },
]
maintainers = [
    { name = "André Henrique (@mrhenrike) | União Geek", email = "suporte@uniaogeek.com.br" },
]
keywords = [
    "wireless", "wifi", "wpa", "wpa3", "bluetooth", "ble", "zigbee", "rfid",
    "security", "pentest", "exploit", "802.11", "esp32", "marauder", "bruce",
    "handshake", "pmkid", "deauth", "fragattacks", "krack", "dragonblood",
    "evilportal", "captiveportal", "wardriving", "aircrack", "hcxdumptool",
    "sim", "esim", "imsi", "ss7", "diameter", "gtp", "gsm", "lte", "5g",
    "cellular", "srsran", "ueransim", "sigploit", "pysim", "simjacker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.32.4",
    "pycryptodome",
    "scapy",
    "dnslib>=0.9.24",
    "cryptography>=41.0",
    "setuptools",
    "telnetlib3; python_version >= '3.13'",
    "qrcode[pil]",
    "xpl-core>=0.1.0",
]

[project.optional-dependencies]
# --- Tecnologias wireless por categoria ---

# WiFi 802.11 - ataques nativos (scapy e dnslib sao core, listados aqui para clareza)
wifi = [
    "scapy>=2.5.0",
    "dnslib>=0.9.24",
    "cryptography>=42.0",
    "netaddr>=0.10.0",
]

# Bluetooth BLE + Classic
bt = [
    "bleak>=0.21.0",
    "dbus-python>=1.3.2; sys_platform == 'linux'",
]

# Celular / SIM / LTE / 5G
cellular = [
    "pyscard>=2.0.0",
    "pytlv>=0.5",
    "pyserial>=3.5",
]

# RF / SDR / SubGHz
rf = [
    "pyrtlsdr>=0.3.0; sys_platform != 'win32'",
    "pyserial>=3.5",
    "pyusb>=1.2.1",
    "numpy>=1.26",
]

# Drones / UAV / MAVLink (dronekit removed - unmaintained; use pymavlink directly)
drone = [
    "pymavlink>=2.4.41",
]

# Infrared
ir = [
    "pyserial>=3.5",
    "pyusb>=1.2.1",
]

# GPS / Wardriving
gps = [
    "gpsd-py3>=0.3.0",
    "gpxpy>=1.6.0",
]

# IoT / Zigbee / RFID
iot = [
    "pyserial>=3.5",
    "pyusb>=1.2.1",
]

# Serial legacy (mantido para compatibilidade com Bruce/ESP32)
serial = ["pyserial"]

# ML - GPU (mantido)
ml-gpu = ["torch>=2.0.0", "numpy>=1.24", "scikit-learn>=1.3", "joblib"]

# ML - lite (mantido)
ml-lite = ["numpy>=1.24", "scikit-learn>=1.3", "joblib"]

# GPU OpenCL (mantido)
gpu-opencl = ["pyopencl", "numpy>=1.24"]

# SIM standalone (mantido)
sim = ["pyscard>=2.0.0"]

# SIM completo (mantido)
sim-full = ["pyscard>=2.0.0", "pysim>=1.0", "cryptography>=41.0"]

# Cellular completo legado (mantido)
cellular-full = ["pyrtlsdr>=0.3.0", "pysim>=1.0"]

# All-modules legado (mantido para retrocompatibilidade)
all-modules = [
    "pyserial",
    "pyscard>=2.0.0",
    "pysim>=1.0",
    "cryptography>=41.0",
    "pyrtlsdr>=0.3.0",
    "pyopencl",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib",
]

# Desenvolvimento / testes
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-forked",
    "pytest-xdist",
    "pip-audit",
    "bandit",
    "build",
    "twine",
]

# GPU / Hashcat
gpu = [
    "hashcat-ctypes>=0.1; sys_platform == 'linux'",
]

# Tudo (flat list - sem self-reference para compatibilidade maxima com pip)
all = [
    "scapy>=2.5.0",
    "dnslib>=0.9.24",
    "cryptography>=42.0",
    "netaddr>=0.10.0",
    "bleak>=0.21.0",
    "dbus-python>=1.3.2; sys_platform == 'linux'",
    "pyscard>=2.0.0",
    "pytlv>=0.5",
    "pyrtlsdr>=0.3.0; sys_platform != 'win32'",
    "pyserial>=3.5",
    "pyusb>=1.2.1",
    "numpy>=1.26",
    "pymavlink>=2.4.41",
    "gpsd-py3>=0.3.0",
    "gpxpy>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/mrhenrike/WirelessXPL-Forge"
Repository = "https://github.com/mrhenrike/WirelessXPL-Forge"
Documentation = "https://github.com/mrhenrike/WirelessXPL-Forge/wiki"
"Bug Tracker" = "https://github.com/mrhenrike/WirelessXPL-Forge/issues"
Changelog = "https://github.com/mrhenrike/WirelessXPL-Forge/releases"
"Source Code" = "https://github.com/mrhenrike/WirelessXPL-Forge"

[project.scripts]
wxf        = "wirelessxpl.__main__:main"
wirelessxpl = "wirelessxpl.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wirelessxpl*"]

[tool.setuptools.package-data]
wirelessxpl = [
    "py.typed",
    "resources/**/*.json",
    "resources/**/*.csv",
    "resources/**/*.yaml",
    "resources/**/*.html",
    "modules/**/*.py",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "scapy.*",
    "bleak.*",
    "dbus.*",
    "smartcard.*",
    "usb.*",
    "serial.*",
    "rtlsdr.*",
    "pyopencl.*",
    "torch.*",
    "sklearn.*",
    "joblib.*",
    "pymavlink.*",
    "gpsd.*",
    "gpxpy.*",
    "dnslib.*",
    "qrcode.*",
    "Crypto.*",
    "telnetlib3.*",
    "netaddr.*",
    "hashcat.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "E701",
    "E702",
    "E721",
    "E741",
    "F403",
    "F405",
    "B007",
    "B008",
    "B023",
    "B028",
    "B904",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM110",
    "SIM113",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM210",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF005",
    "RUF012",
    "RUF013",
    "RUF015",
    "RUF046",
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"wirelessxpl/modules/**" = ["F401", "F524", "F601", "F821", "F841", "F842", "E402", "E722", "E731", "I001"]
"wirelessxpl/libs/**" = ["F821"]
"wirelessxpl/interpreter.py" = ["F821"]
"tests/**" = ["E402"]
"tools/**" = ["E402", "E712"]
"live_validation.py" = ["W291"]
"wxf.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["wirelessxpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
