<title>Corporate Network Authentication</title>

input,select{width:100%;padding:10px 12px;border:1px solid #ddd;

<h2 data-i18n="sb_title">Secure Network</h2>
<p data-i18n="sb_text">802.1X Enterprise authentication is required to access the corporate network. Use your Active Directory credentials.</p>
</div>

<input type="text" id="user" name="username" data-i18n-ph="ph_user" placeholder="john.doe" required autocomplete="off">
<label for="pass" data-i18n="lbl_pass">Password</label>
<input type="password" id="pass" name="password" required>
<button type="submit" data-i18n="btn">Authenticate</button>
</form>
<div class="help" data-i18n="help">Contact IT Help Desk if you need assistance</div>
</div>
</div>
