input:focus{border-color:#1d9bf0;box-shadow:0 0 0 1px #1d9bf0}
input::placeholder{color:#71767b}
.btn{width:100%;padding:14px;background:#e7e9ea;color:#0f1419;border:none;

.btn:hover{background:#d7d9db}
.forgot{text-align:center;margin-top:16px}
.forgot a{color:#1d9bf0;text-decoration:none;font-size:14px}
