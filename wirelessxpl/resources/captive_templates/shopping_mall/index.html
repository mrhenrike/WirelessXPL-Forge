*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,sans-serif;
background:linear-gradient(135deg,#667eea 0%,#764ba2 40%,#f093fb 70%,#f5576c 100%);
display:flex;justify-content:center;align-items:center;min-height:100vh;
padding:16px}
.card{background:rgba(255,255,255,.96);border-radius:20px;overflow:hidden;
width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2);
backdrop-filter:blur(10px)}
.header{padding:36px 28px 24px;text-align:center}
.bag{font-size:3em;margin-bottom:8px;display:block;
filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.header h1{font-size:1.4em;font-weight:700;
background:linear-gradient(135deg,#764ba2,#f5576c);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
background-clip:text}
.header p{font-size:.82em;color:#777;margin-top:6px;line-height:1.4}
.body{padding:0 28px 28px}
label{display:block;font-size:.78em;color:#666;margin-bottom:5px;
font-weight:600}
input[type="text"],input[type="password"]{width:100%;padding:12px 14px;
border:2px solid #eee;border-radius:10px;font-size:.92em;
margin-bottom:14px;outline:none;transition:border-color .2s;
background:#fafafa}
input:focus{border-color:#764ba2;background:#fff}
button{width:100%;padding:14px;border:none;border-radius:10px;
font-size:.95em;font-weight:700;cursor:pointer;color:#fff;
background:linear-gradient(135deg,#764ba2 0%,#f5576c 100%);
transition:opacity .2s;box-shadow:0 4px 16px rgba(118,75,162,.35)}
button:hover{opacity:.9}
.opt-in{display:flex;align-items:flex-start;gap:8px;margin-bottom:18px;
padding:0 2px}
.opt-in input[type="checkbox"]{width:auto;margin:0;margin-top:2px;
accent-color:#764ba2;flex-shrink:0}
.opt-in label{margin:0;font-size:.72em;color:#999;font-weight:400;
line-height:1.4;cursor:pointer}
.footer{text-align:center;padding:0 28px 24px;font-size:.7em;color:#bbb;
line-height:1.5}
@media(max-width:480px){.card{max-width:100%;border-radius:14px}
.header{padding:28px 20px 18px}.body{padding:0 20px 22px}
.footer{padding:0 20px 20px}}
</style>

</div>
<button type="submit" data-i18n="btn_login">Connect Free</button>
