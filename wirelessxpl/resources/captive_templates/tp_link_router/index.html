body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;

.card-header p{color:rgba(255,255,255,.85);font-size:.8em;margin-top:4px}

label{display:block;font-size:.82em;color:#555;margin-bottom:5px;font-weight:500}
input[type=password]{width:100%;padding:9px 12px;border:1px solid #ccc;border-radius:3px;

input[type=password]:focus{border-color:#00a0e9;box-shadow:0 0 0 2px rgba(0,160,233,.15)}
.btn-row{margin-top:8px}
button{background:#00a0e9;color:#fff;border:none;border-radius:3px;padding:10px 32px;
