<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{success_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 12px; padding: 40px 32px; text-align: center; max-width: 360px; width: 100%; border: 1px solid #e8ecf1; box-shadow: 0 4px 20px rgba(0, 80, 130, 0.1); }
        .spinner { width: 48px; height: 48px; border: 3px solid #e8ecf1; border-top-color: #00a0df; border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 17px; color: #00a0df; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 13px; color: #6b7280; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>{{success_heading}}</h1>
        <p>{{success_message}}</p>
    </div>
</body>
</html>
