<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{success_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f2f2f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #fff; padding: 40px; border-radius: 8px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.08); max-width: 420px; margin: 16px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #ddd; border-top: 3px solid #cf0a2c; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { color: #cf0a2c; font-size: 16px; }
        p { color: #666; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>{{success_heading}}</h1>
        <p>{{success_message}}</p>
    </div>
</body>
</html>
