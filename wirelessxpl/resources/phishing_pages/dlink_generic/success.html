<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applying settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Verdana, Geneva, sans-serif; background: #ececec; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #fff; border: 1px solid #ccc; border-top: 4px solid #f58220; padding: 36px 28px; text-align: center; max-width: 380px; width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .spinner { width: 42px; height: 42px; border: 3px solid #eee; border-top-color: #f58220; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 18px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 15px; color: #444; margin-bottom: 8px; }
        p { font-size: 12px; color: #666; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Applying settings…</h1>
        <p>Saving wireless security options. This may take up to one minute.</p>
    </div>
</body>
</html>
