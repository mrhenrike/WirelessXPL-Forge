<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN — Authenticating...</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #e8ecf1;
               display: flex; align-items: center; justify-content: center;
               min-height: 100vh; }
        .card { background: #fff; border-radius: 8px; padding: 40px;
                text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
                width: 380px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #ddd;
                   border-top: 3px solid #1a237e; border-radius: 50%;
                   animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { color: #1a237e; font-size: 18px; }
        p { color: #666; font-size: 13px; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Verifying Credentials...</h1>
        <p>Waiting for MFA confirmation.</p>
        <p style="font-size:11px;color:#999;margin-top:12px;">Please approve the push notification on your device.</p>
    </div>
</body>
</html>
