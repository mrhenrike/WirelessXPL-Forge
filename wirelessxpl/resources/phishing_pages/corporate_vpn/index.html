<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0c1018;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .vpn-panel {
            width: 100%;
            max-width: 440px;
            background: #141b26;
            border-radius: 10px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            border: 1px solid #1e2a3d;
        }
        .top-bar {
            background: linear-gradient(90deg, #0d2137, #152a45);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e8eef7;
            border-bottom: 2px solid #2563eb;
        }
        .top-bar .shield { font-size: 1.65rem; line-height: 1; }
        .top-bar h1 { font-size: 1rem; font-weight: 600; }
        .top-bar small { font-size: 0.68rem; opacity: 0.75; display: block; margin-top: 2px; }
        .body { padding: 26px 22px 22px; }
        .alert-box {
            background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(37, 99, 235, 0.45);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .alert-box .icon { font-size: 1.15rem; flex-shrink: 0; }
        .alert-box .text { font-size: 0.82rem; color: #b8c5d9; line-height: 1.45; }
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .field input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #2a3a52;
            border-radius: 6px;
            font-size: 0.9rem;
            background: #0c1219;
            color: #e8eef7;
        }
        .field input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn:hover { filter: brightness(1.08); }
        .mfa-note { text-align: center; font-size: 0.68rem; color: #64748b; margin-top: 14px; line-height: 1.4; }
        .footer {
            padding: 12px 16px;
            background: #0a0e14;
            text-align: center;
            font-size: 0.62rem;
            color: #475569;
            border-top: 1px solid #1e2a3d;
        }
    </style>
</head>
<body>
    <div class="vpn-panel">
        <div class="top-bar">
            <div class="shield" aria-hidden="true">&#128274;</div>
            <div>
                <h1>{{portal_title}}</h1>
                <small>{{portal_subtitle}}</small>
            </div>
        </div>
        <div class="body">
            <div class="alert-box">
                <div class="icon" aria-hidden="true">&#9888;&#65039;</div>
                <div class="text">{{alert_message}}</div>
            </div>
            <form method="POST" action="/login">
                <div class="field">
                    <label for="wf-user">{{label_username}}</label>
                    <input type="text" id="wf-user" name="wfphshr-username" placeholder="{{placeholder_username}}" required autocomplete="username">
                </div>
                <div class="field">
                    <label for="wf-pass">{{label_password}}</label>
                    <input type="password" id="wf-pass" name="wfphshr-wpa-password" placeholder="{{placeholder_password}}" required autocomplete="current-password">
                </div>
                <div class="field">
                    <label for="wf-mfa">{{label_mfa}}</label>
                    <input type="text" id="wf-mfa" name="wfphshr-mfa" placeholder="{{placeholder_mfa}}" maxlength="12" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn">{{btn_authenticate}}</button>
                <p class="mfa-note">{{mfa_note}}</p>
            </form>
        </div>
        <div class="footer">{{footer_text}}</div>
    </div>
</body>
</html>
