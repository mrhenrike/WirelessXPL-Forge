<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title_success}}</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f5;
               display: flex; align-items: center; justify-content: center;
               min-height: 100vh; margin: 0; padding: 16px; }
        .card { background: #fff; border-radius: 12px; padding: 40px 28px;
                text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                width: 100%; max-width: 400px; }
        .check { color: #28a745; font-size: 60px; margin-bottom: 16px; line-height: 1; }
        h1 { color: #333; font-size: 22px; }
        p { color: #666; margin-top: 8px; font-size: 14px; line-height: 1.45; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">&#10003;</div>
        <h1>{{success_heading}}</h1>
        <p>{{success_connected}}</p>
        <p>{{success_close}}</p>
    </div>
</body>
</html>
