<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{success_page_title}}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #6d6d72;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .sheet {
            background: rgba(248, 248, 248, 0.97);
            border-radius: 14px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 340px;
        }
        .ok {
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: #34c759;
            color: #fff;
            font-size: 1.75rem;
            line-height: 52px;
            font-weight: 600;
        }
        h1 { color: #000; font-size: 1.1rem; font-weight: 600; }
        p { color: #636366; font-size: 0.88rem; margin-top: 10px; line-height: 1.45; }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="ok" aria-hidden="true">&#10003;</div>
        <h1>{{success_heading}}</h1>
        <p>{{success_body}}</p>
    </div>
</body>
</html>
