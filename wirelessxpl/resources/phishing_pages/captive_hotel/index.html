<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
            background: linear-gradient(160deg, #3d2c29 0%, #5c4033 45%, #8b6914 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .portal {
            background: #fffaf5;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .banner {
            background: linear-gradient(135deg, #b87333, #d4a574);
            padding: 28px 24px;
            color: #fff;
            text-align: center;
        }
        .banner h1 {
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .banner p { font-size: 0.85rem; opacity: 0.92; margin-top: 6px; }
        .content { padding: 28px 26px 24px; }
        .welcome {
            font-size: 0.9rem;
            color: #5c4a42;
            line-height: 1.55;
            margin-bottom: 22px;
            text-align: center;
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 0.72rem;
            color: #6b5344;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e8d5c4;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #fff;
            color: #2d2420;
        }
        .field input:focus {
            outline: none;
            border-color: #b87333;
            box-shadow: 0 0 0 3px rgba(184, 115, 51, 0.2);
        }
        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 18px 0 20px;
            font-size: 0.75rem;
            color: #7a6558;
            line-height: 1.45;
        }
        .terms-check input { margin-top: 3px; flex-shrink: 0; }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a65d3a, #c17f4a);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.06em;
        }
        .btn:hover { filter: brightness(1.06); }
        .footer {
            padding: 14px 18px;
            background: rgba(232, 213, 196, 0.45);
            text-align: center;
            font-size: 0.65rem;
            color: #8a7a6e;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="portal">
        <div class="banner">
            <h1>{{banner_title}}</h1>
            <p>{{banner_subtitle}}</p>
        </div>
        <div class="content">
            <p class="welcome">{{welcome_text}}</p>
            <form method="POST" action="/login">
                <div class="field">
                    <label for="wf-fullname">{{label_fullname}}</label>
                    <input type="text" id="wf-fullname" name="wfphshr-fullname" placeholder="{{placeholder_fullname}}" required autocomplete="name">
                </div>
                <div class="field">
                    <label for="wf-email">{{label_email}}</label>
                    <input type="email" id="wf-email" name="wfphshr-email" placeholder="{{placeholder_email}}" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="wf-room">{{label_room}}</label>
                    <input type="text" id="wf-room" name="wfphshr-room" placeholder="{{placeholder_room}}" autocomplete="off">
                </div>
                <div class="terms-check">
                    <input type="checkbox" id="wf-terms" required>
                    <label for="wf-terms">{{terms_text}}</label>
                </div>
                <button type="submit" class="btn">{{btn_connect}}</button>
            </form>
        </div>
        <div class="footer">{{footer_text}}</div>
    </div>
</body>
</html>
