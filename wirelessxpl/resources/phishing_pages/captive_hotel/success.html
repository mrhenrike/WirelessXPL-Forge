<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{success_page_title}}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
            background: linear-gradient(160deg, #3d2c29 0%, #5c4033 45%, #8b6914 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fffaf5;
            border-radius: 12px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        h1 { color: #8b5a2b; font-size: 1.35rem; font-weight: 500; }
        p { color: #6b5344; font-size: 0.9rem; margin-top: 10px; line-height: 1.5; }
        .note { font-size: 0.72rem; color: #9a8a7e; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>&#10003; {{success_heading}}</h1>
        <p>{{success_body}}</p>
        <p class="note">{{success_session_note}}</p>
    </div>
</body>
</html>
