<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{success_page_title}}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #3a3a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background: #ececec;
            border-radius: 8px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            width: 100%;
            max-width: 320px;
            border: 1px solid #b8b8b8;
        }
        .icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: #28c840;
            color: #fff;
            font-size: 1.6rem;
            line-height: 48px;
            font-weight: 700;
        }
        h1 { color: #1a5f9e; font-size: 1rem; font-weight: 600; }
        p { color: #555; font-size: 0.82rem; margin-top: 10px; line-height: 1.45; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">&#10003;</div>
        <h1>{{success_heading}}</h1>
        <p>{{success_body}}</p>
    </div>
</body>
</html>
