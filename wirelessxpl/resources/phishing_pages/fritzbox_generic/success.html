<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{success_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #ebebeb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #fff; border: 1px solid #ccc; border-top: 4px solid #d20000; padding: 36px 28px; text-align: center; max-width: 400px; width: 100%; }
        .spinner { width: 44px; height: 44px; border: 3px solid #e0e0e0; border-top-color: #d20000; border-radius: 50%; animation: spin 0.85s linear infinite; margin: 0 auto 18px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 16px; color: #d20000; margin-bottom: 8px; }
        p { font-size: 13px; color: #555; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>{{success_heading}}</h1>
        <p>{{success_message}}</p>
    </div>
</body>
</html>
